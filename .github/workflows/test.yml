# Her gönderimde otomatik denetimleri çalıştırır. Bu klasör (ilk-lot) bir git deposunun kökü olduğunda etkindir.
# DİKKAT: Bu iş akışı yazıldı ama gerçek bir GitHub deposunda hiç çalıştırılmadı; ilk çalıştırmada çıktıyı izle.
# NOT: Tarayıcı tabanlı uygulama testleri (testler/uygulama_testleri.py) b27 yeniden yapılandırmasından sonra yeniden yazılmalı;
# bu yüzden burada çalıştırılmıyor (docs/ESKI_YENI_ADLAR.md).
name: testler
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bağımlılıklar
        run: |
          pip install numpy pandas scipy matplotlib pyyaml
          npm ci
      - name: Kod denetimi (ESLint) ve modül bağlantıları
        run: |
          npm run lint
          npm run check:modules
          npm run check:classes
      - name: Analiz testleri
        run: python analiz/test_betikler.py
      - name: Araç testleri (yayın aracı, saklama takvimi, CI tanımı)
        run: python testler/arac_testleri.py
      - name: Kuru çalıştırma (sahte veriyle uçtan uca hat)
        run: python analiz/kuru_calistirma.py
      - name: Firestore güvenlik kuralları (Emulator)
        working-directory: firebase/kural_testleri
        run: |
          npm ci
          npm test
