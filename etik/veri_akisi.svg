<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>İlk Lot veri akışı</title>
<desc>Katılımcı telefonundan Firebase'e, araştırmacı paneline, yerel analize ve yayına veri akışı; kimlik bilgisi toplanmaz.</desc>
<defs><marker id="o" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 1L11 6L0 11z" fill="#4338A8"/></marker></defs>
<rect width="980" height="500" fill="#F4F4F7"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1E1B3A">İlk Lot: veri akışı</text>
<text x="24" y="56" font-size="13" fill="#5B5A72">Kimlik bilgisi (ad, e-posta, öğrenci numarası, konum) toplanmaz; veri yalnızca rastgele bir katılım koduyla eşleşir.</text>
<g font-size="13" fill="#1E1B3A">
<rect x="24" y="96" width="200" height="130" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="40" y="122" font-weight="700">1. Katılımcı telefonu</text>
<text x="40" y="146" fill="#5B5A72">Tarayıcıda uygulama</text>
<text x="40" y="166" fill="#5B5A72">Kararlar, süreler, testler,</text>
<text x="40" y="184" fill="#5B5A72">simülatör işlemleri,</text>
<text x="40" y="202" fill="#5B5A72">ekran ve sekme etkinliği</text>
<rect x="272" y="96" width="210" height="130" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="288" y="122" font-weight="700">2. Bulut (Firebase)</text>
<text x="288" y="146" fill="#5B5A72">Anonim oturum, HTTPS</text>
<text x="288" y="166" fill="#5B5A72">participants/{kod}</text>
<text x="288" y="184" fill="#5B5A72">participants/{kod}/events</text>
<text x="288" y="208" fill="#9A6A00" font-weight="600">Bölge: [DOLDUR]</text>
<rect x="530" y="96" width="200" height="130" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="546" y="122" font-weight="700">3. Araştırmacı paneli</text>
<text x="546" y="146" fill="#5B5A72">E-posta ve parola girişi</text>
<text x="546" y="166" fill="#5B5A72">Yalnızca yetkili hesap</text>
<text x="546" y="184" fill="#5B5A72">listeler ve indirir</text>
<text x="546" y="208" fill="#9A6A00" font-weight="600">Hesaplar: [DOLDUR]</text>
<rect x="778" y="96" width="178" height="130" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="794" y="122" font-weight="700">4. Analiz bilgisayarı</text>
<text x="794" y="146" fill="#5B5A72">CSV ve Python betikleri</text>
<text x="794" y="166" fill="#5B5A72">Serbest metin gözden</text>
<text x="794" y="184" fill="#5B5A72">geçirilip temizlenir</text>
<text x="794" y="208" fill="#9A6A00" font-weight="600">Saklama: [DOLDUR]</text>
</g>
<g stroke="#4338A8" stroke-width="2" fill="none" marker-end="url(#o)">
<line x1="226" y1="161" x2="270" y2="161"/><line x1="484" y1="161" x2="528" y2="161"/><line x1="732" y1="161" x2="776" y2="161"/>
</g>
<g font-size="11.5" fill="#4338A8" text-anchor="middle"><text x="248" y="150">yazma</text><text x="506" y="150">okuma</text><text x="754" y="150">CSV</text></g>
<g stroke="#8E8DA3" stroke-width="1.6" stroke-dasharray="5 5" fill="none"><line x1="377" y1="226" x2="377" y2="260"/></g>
<g font-size="13" fill="#1E1B3A">
<rect x="24" y="262" width="214" height="104" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="40" y="288" font-weight="700">Kart dağıtımı</text>
<text x="40" y="312" fill="#5B5A72" font-size="12.5">Kimin hangi kodu aldığı</text>
<text x="40" y="332" fill="#5B5A72" font-size="12.5">kaydedilmez (önerilen)</text>
<rect x="272" y="262" width="458" height="112" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="288" y="288" font-weight="700">Güvenlik kuralları (sunucuda)</text>
<text x="288" y="310" fill="#5B5A72" font-size="12.5">Kaydı yalnızca kodu bilen katılımcı yazar; grubunu</text>
<text x="288" y="328" fill="#5B5A72" font-size="12.5">değiştiremez, çekilmiş kaydı geri açamaz.</text>
<text x="288" y="346" fill="#5B5A72" font-size="12.5">Olay kaydı eklenir, değiştirilemez; okuma araştırmacıda.</text>
<text x="288" y="362" fill="#5B5A72" font-size="12.5">Kayıt listesi yalnızca araştırmacıda.</text>
<rect x="778" y="262" width="178" height="104" rx="14" fill="#fff" stroke="#DCDBE6"/>
<text x="794" y="288" font-weight="700">5. Yayın</text>
<text x="794" y="312" fill="#5B5A72" font-size="12.5">Kimliksiz, toplu sonuçlar</text>
<text x="794" y="336" fill="#9A6A00" font-weight="600" font-size="12.5">Paylaşım: [KARAR]</text>
<rect x="24" y="394" width="932" height="82" rx="14" fill="#FCEFD6" stroke="#E7C98A"/>
<text x="40" y="420" font-weight="700" fill="#7A4B00">Çekilme ve silme</text>
<text x="40" y="442" fill="#7A4B00" font-size="12.5">Katılımcı menüden çekilir: kayıt "çekildi" olur ve analizden çıkar. Araştırmacı panelden</text>
<text x="40" y="460" fill="#7A4B00" font-size="12.5">"Çekilenlerin verisini kalıcı sil" ile olay kayıtlarını siler; yalnızca kod, grup ve çekilme tarihi kalır.</text>
</g>
</svg>
