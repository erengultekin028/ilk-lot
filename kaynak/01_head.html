<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İlk Lot: karar araştırması</title>
<!-- Ana ekrana ekle: tek dosya olduğu için manifest ve service worker yok; tarayıcı yine de kısayol ekler (iOS: tam ekran açılır). Çevrimdışı çalışmaz. -->
<meta name="theme-color" content="#F4F4F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İlk Lot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/png;base64,{{IKON}}">
<link rel="icon" type="image/png" href="data:image/png;base64,{{IKON}}">
<style>
/* Yazı tipi dosyanın içinde (Bricolage Grotesque, SIL OFL 1.1; kaynak/yazi/). Türkçe karakterli alt küme; dış sunucuya bağlanılmaz */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:400 599;font-display:swap;src:url(data:font/woff;base64,{{YAZI:Regular}}) format("woff")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600 900;font-display:swap;src:url(data:font/woff;base64,{{YAZI:Bold}}) format("woff")}
/* Üniversite paleti: soğuk gri zemin, çivit mavisi eylem.
   Anlam ayrımı korunur: --pr = eylem (çivit), --wr/--wt = uyarı (amber), --up/--dn = fiyat yönü (yeşil/kırmızı).
   Çivit, yeşil ve kırmızıyla karışmadığı için hiçbir seçenek "doğru" ya da "tehlikeli" gibi kodlanmaz. */
:root{
  --bg:#F4F4F4;--sf:#FFFFFF;--sf2:#EAEAEA;--ln:#D8D8D8;
  --tx:#111111;--mu:#595959;--mu2:#5C5C5C;
  --ac:#111827;--acs:rgba(17,24,39,.10);--act:#000000;--ink:#FFFFFF;
  --pr:#111827;--onpr:#FFFFFF;--fl:#111827;
  --cfx:inset 0 0 34px 2px rgba(194,65,45,.30),inset 0 0 0 2px rgba(194,65,45,.55);--pend:#C98A1B;
  --up:#1B7B54;--ups:rgba(27,123,84,.1);--dn:#C2412D;--dns:rgba(194,65,45,.09);
  --wr:#FCEFD6;--wt:#7A4B00;
  --shadow:0 -14px 44px rgba(0,0,0,.16);
  --fd:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Koyu tema: tema düğmesiyle (ya da görüntüleyici data-theme="dark" verirse). Aynı anlam ayrımı korunur */
:root[data-theme="dark"]{
  --bg:#0B0B0C;--sf:#141416;--sf2:#1D1D20;--ln:#2E2E33;
  --tx:#F0F0F2;--mu:#A5A5AD;--mu2:#92929A;
  --ac:#F2A93B;--acs:rgba(242,169,59,.14);--act:#F6C979;--ink:#1A1200;
  --pr:#F2A93B;--onpr:#1A1200;--fl:#F2A93B;
  --cfx:inset 0 0 70px 12px rgba(255,70,55,.5),inset 0 0 0 2px rgba(255,90,70,.5);--pend:#F2A93B;
  --up:#3FD08F;--ups:rgba(63,208,143,.13);--dn:#FF6B5B;--dns:rgba(255,107,91,.13);
  --wr:rgba(242,169,59,.13);--wt:#F6C979;
  --shadow:0 -14px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer}
.brand b{font:700 20px/1 var(--fd);letter-spacing:-.4px;white-space:nowrap}
.hr{display:flex;align-items:center;gap:8px}
.score{white-space:nowrap;font-size:12px;font-weight:700;color:var(--act);background:var(--acs);padding:6px 11px;border-radius:999px}
.icon{width:36px;height:36px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);display:grid;place-items:center;padding:0;cursor:pointer;font-size:18px;line-height:1;flex:none}
main{flex:1;overflow-y:auto;padding:2px 16px 28px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;gap:2px;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px 8px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu2);font-size:11px;font-weight:600;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}
nav button{position:relative}nav button.nw::after{content:'';position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--tx);border:2px solid var(--sf)}

#toast{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
/* Hisse ekranı açıkken bildirim üste çıkar, Al/Sat ve Vazgeç düğmelerini kapatmasın */
#toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}

/* Portföy değeri sayfanın tek "büyük" öğesi: dikkat önce buraya gitsin */
.hero{padding:10px 2px 18px}
.hero .lbl{color:var(--mu);font-size:13px}
.hero .val{font:750 46px/1.02 var(--fd);letter-spacing:-1.8px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--ups);color:var(--up)}.pill.dn{background:var(--dns);color:var(--dn)}
.hsub{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mu)}
.hsub b{display:block;color:var(--tx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

.seg{display:flex;gap:4px;background:var(--sf2);border-radius:14px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:600;font-size:13.5px;padding:10px 6px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.seg.sm button{font-size:12px;padding:8px 4px}

.sec{background:var(--sf);border:1px solid var(--ln);border-radius:20px;margin-bottom:14px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 16px 6px}
.sh h3{margin:0;font:700 17px/1.2 var(--fd);letter-spacing:-.2px}
.sb{padding:6px 16px 16px}
.sb p{margin:6px 0 0}

.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;border-top:1px solid var(--ln);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.sh+.row,.sh+.list .row:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font:700 12px var(--fd);color:var(--mu);flex:none;letter-spacing:.2px}
.rm{flex:1;min-width:0;display:block}
.rm .s{display:block;font-weight:700}
.rm .n{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:block;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rr .rp{display:block;font-weight:600}
.rr .rc{display:block;font-size:12.5px;font-weight:600}
.rs{flex:none;display:block;line-height:0}
.chev{width:8px;height:8px;border-right:2px solid var(--mu2);border-top:2px solid var(--mu2);transform:rotate(45deg);flex:none;margin-right:4px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.t-up{background:var(--ups);color:var(--up)}.t-dn{background:var(--dns);color:var(--dn)}.t-h{background:var(--wr);color:var(--wt)}

.btn{display:block;width:100%;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);border-radius:14px;padding:15px 16px;font-weight:700;font-size:15px;cursor:pointer;text-align:center}
.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--onpr)}
.btn.danger{background:var(--dn);border-color:var(--dn);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn+.btn{margin-top:10px}
.link{background:none;border:0;color:var(--mu);font-weight:600;padding:10px;cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:var(--sf2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--act)}

.note{display:flex;gap:10px;background:var(--wr);color:var(--wt);border-radius:16px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.note b{color:inherit}
.note.info{background:var(--sf2);color:var(--mu)}
.foot{text-align:center;color:var(--mu2);font-size:12px;margin:10px 0 0}

.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .4s}
.met{margin-top:14px}
.met .mh{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* b19 serbest mod */
.flim{margin:0 0 14px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;font-size:13px}
.flim .kv{flex-wrap:wrap;gap:2px 10px}
.fbar{height:8px;border-radius:99px;background:var(--sf2);margin:8px 0 6px;overflow:hidden}
.fbar i{display:block;height:100%;border-radius:99px;background:var(--mu);transition:width .4s}
.fbar i.hot{background:var(--dn)}
.flvs{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.flv{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;min-height:44px;padding:13px 15px;border:1.5px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);cursor:pointer}
.flv b{font:700 17px var(--fd)}
.flv span{font-weight:650;font-size:13px}
.flv small{color:var(--mu);font-size:12.5px;line-height:1.4}
.flv.on{border-color:var(--ac);background:var(--sf2);box-shadow:0 0 0 1px var(--ac) inset}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat span{display:block;color:var(--mu);font-size:12px}
.stat b{display:block;font:700 20px/1.2 var(--fd);margin-top:2px;font-variant-numeric:tabular-nums}
.field{width:100%;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:0 14px;font:inherit}
.field::placeholder{color:var(--mu2)}

/* Alt pencere (hisse ekranı) */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(3,6,14,.58);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:94%;overflow-y:auto;background:var(--sf);border-top:1px solid var(--ln);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
#sheet.open{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 12px}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shh .t{font:700 20px/1.1 var(--fd)}
.sp{font:750 36px/1.05 var(--fd);letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin-top:12px}
.lab{display:block;color:var(--mu);font-size:13px;margin:14px 0 6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper>button{width:48px;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);font-size:22px;cursor:pointer;flex:none}
.stepper input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);text-align:center;font:700 20px var(--fd)}
.stepper .btn.sm{height:48px}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--mu)}
.kv b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.kv b.up,.stat b.up{color:var(--up)}.kv b.dn,.stat b.dn{color:var(--dn)}
.kvs{margin:12px 0}
details.more{border-top:1px solid var(--ln);margin-top:14px}
details.more+details.more{margin-top:0}
details.more summary{list-style:none;cursor:pointer;padding:15px 2px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more>div{padding:0 2px 14px}
.q{font-weight:700;margin:18px 0 10px}
.big-sum{font:700 24px/1.2 var(--fd);letter-spacing:-.4px;margin:14px 0 4px}
.count{font:800 64px/1 var(--fd);text-align:center;margin:18px 0;font-variant-numeric:tabular-nums}

/* Karşılama, test ve tanıtım ekranları */
.stage{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:18px 4px 8px}
.stage h1{font:750 32px/1.08 var(--fd);letter-spacing:-.9px;margin:20px 0 12px}
.stage p{color:var(--mu);margin:0 0 12px}
.stage .act{margin-top:18px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--ln);transition:width .2s}
.dots i.on{width:24px;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer}
.opt.ok{border-color:var(--up);background:var(--ups)}
.opt.no{border-color:var(--dn);background:var(--dns)}
.giant{font:800 52px/1 var(--fd);letter-spacing:-2px;color:var(--ac);font-variant-numeric:tabular-nums}

.wrapc{background:linear-gradient(160deg,#1C2A4A,#101827);color:#F1EEE6;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #2A3A60}
.wrapc .k{font:800 34px/1.05 var(--fd);color:#F2A93B;margin:8px 0 6px;letter-spacing:-.8px}
.wrapc .l{margin-top:7px;font-size:14px;color:#D8DCE6}
.gauge-t{text-align:center;color:var(--mu);font-size:13.5px;margin:4px 0 0}
pre.json{font-size:11px;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;color:var(--mu);background:var(--bg);border-radius:12px;padding:10px}
/* Modal: kriz sonrası soru ve onay pencereleri. Hisse ekranının da üstünde durur */
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.66)}
#modal.open{display:flex}
#modal .box{width:100%;max-width:400px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h2{font:750 24px/1.15 var(--fd);letter-spacing:-.5px;margin:0 0 8px}
#modal p{color:var(--mu);margin:0 0 14px}
.scale{display:flex;gap:6px}.scale button{flex:1;height:52px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);font:700 18px var(--fd);cursor:pointer}
.scale-l{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin:6px 2px 0}
.btn.ghost-dn{background:none;border-color:var(--dn);color:var(--dn)}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.steps i.on{background:var(--ac)}
/* Kayıt durumu noktası: yeşil = kaydedildi, sarı = gönderiliyor, kırmızı = bağlantı yok */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--up)}
.dot.pend{background:var(--pend)}.dot.err{background:var(--dn);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.q2{font-weight:700;margin:20px 0 8px}
/* ── Yön ışığı: ekran kenarlarından içeri yayılan yumuşak ışık. Tıklamayı engellemez ──
   Yükselişte yeşil, düşüşte kırmızı. Sert düşüşte biraz daha belirgin. Yavaşça "nefes alır".
   Işık rengi --glow değişkeninden gelir; ::after onu #app'ten devralır. */
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:0;transition:opacity .9s ease;box-shadow:var(--glow,none)}
#app.gl-up{--glow:inset 0 0 70px -10px rgba(30,138,94,.30),inset 0 0 22px -12px rgba(30,138,94,.35)}
#app.gl-dn{--glow:inset 0 0 70px -10px rgba(194,65,45,.28),inset 0 0 22px -12px rgba(194,65,45,.32)}
#app.gl-dn.gl-strong{--glow:inset 0 0 90px -8px rgba(194,65,45,.38),inset 0 0 26px -10px rgba(194,65,45,.40)}
:root[data-theme="dark"] #app.gl-up{--glow:inset 0 0 80px -10px rgba(63,208,143,.30)}
:root[data-theme="dark"] #app.gl-dn{--glow:inset 0 0 80px -10px rgba(255,107,91,.28)}
:root[data-theme="dark"] #app.gl-dn.gl-strong{--glow:inset 0 0 100px -8px rgba(255,107,91,.38)}
#app.gl-up::after,#app.gl-dn::after{opacity:1;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#app.gl-up::after,#app.gl-dn::after{animation:none;opacity:.8}}
/* Ekranda görünmeyen ama ekran okuyucunun okuduğu metin */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Yön rozeti: ▲ yeşil zeminli, ▼ kırmızı zeminli */
.dir{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;margin-top:4px}
.dir.up{background:var(--ups);color:var(--up)}.dir.dn{background:var(--dns);color:var(--dn)}
.giant .ar{display:inline-block;transform-origin:center bottom;animation:arPop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes arPop{0%{transform:scale(.4) translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.giant .ar{animation:none}}
/* Düşen fiyat anlık kırmızı parlar ve hafifçe titrer */
.fl{animation:fl .6s ease-out}
@keyframes fl{0%{color:#fff;background:rgba(255,80,60,.55);transform:translateX(-2px)}25%{transform:translateX(2px)}50%{transform:translateX(-1px)}100%{background:transparent;transform:none}}
.rp{border-radius:6px;padding:0 3px;margin-right:-3px}
/* ── Kararlarının filmi ── */
.film{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px 12px 12px;margin:6px 0 14px;color:var(--tx)}
:root[data-theme="dark"] .film{background:linear-gradient(180deg,#141416,#0F0F11)}
.film .ft{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.film .ft b{font:700 17px var(--fd)}
.film .cap{min-height:40px;padding:8px 6px 0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.film .cap i{width:8px;height:8px;border-radius:50%;flex:none}
.film .lg{display:flex;gap:14px;font-size:11.5px;color:var(--mu);padding:6px 4px 0;flex-wrap:wrap}
.film .lg span{display:inline-flex;align-items:center;gap:5px}
.mk{transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
.mk.off{opacity:0;transform:scale(.2)}
@media (prefers-reduced-motion:reduce){#app.crisis::after{animation:none;opacity:.7}.fl{animation:none}.mk{transition:none}}
/* ── Araştırmacı panosu ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.kpi{background:var(--sf2);border-radius:16px;padding:12px 14px}
.kpi span{display:block;color:var(--mu);font-size:12px}
.kpi b{display:block;font:750 28px/1.1 var(--fd);letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;color:var(--mu);font-size:12px;font-weight:600}
.flag{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.flag:first-child{border-top:0}
.flag code{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
/* Hata kutusu: ".stage p" gri rengini ezmesi için daha belirgin seçici. Her basışta sallanır ki tepki görülsün */
.stage .err,.err{display:flex;gap:10px;align-items:flex-start;color:var(--dn);background:var(--dns);border:1px solid color-mix(in srgb,var(--dn) 45%,transparent);border-radius:14px;padding:11px 13px;margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.4}
.err::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--dn);color:var(--ink);font:800 13px/20px var(--fb);text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* ── Karar seçenekleri: üçü de aynı görünümde, hiçbiri öne çıkarılmaz ── */
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:16px;padding:16px 18px;cursor:pointer;color:var(--tx);transition:border-color .15s,transform .1s}
.choice b{font:700 19px var(--fd)}.choice span{color:var(--mu);font-size:13px;text-align:right}
.choice:hover{border-color:var(--mu2)}.choice:disabled{opacity:.45;cursor:not-allowed}.choice:active{transform:scale(.99)}
.steps i{height:5px}
/* ── Rehberli tur: alttaki kart + vurgulanan öğe. Tur sürerken seçimler kilitli ── */
#tour{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:46;background:var(--tx);color:var(--bg);border-radius:20px;padding:16px 16px 12px;box-shadow:0 18px 50px rgba(20,18,43,.35)}
/* Vurgulanan öğe alttaysa (alt menü) kart üste geçer */
#tour.top{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
#tour .tt{font-size:12px;font-weight:700;opacity:.7;margin-bottom:4px}
#tour p{margin:0 0 12px;font-size:15px;line-height:1.45}
#tour .tb{display:flex;justify-content:space-between;align-items:center}
#tour .tb button{border:0;cursor:pointer;font-weight:700;border-radius:12px;padding:10px 16px;font-size:14px}
#tour .tn{background:var(--bg);color:var(--tx)}#tour .ts{background:none;color:var(--bg);opacity:.75;padding-left:0}
.hl{outline:3px solid var(--ac);outline-offset:4px;border-radius:20px;scroll-margin-top:12px;transition:outline-color .2s}
#app.touring .choices,#app.touring [data-sim]{pointer-events:none}
#app.touring #view{padding-bottom:260px}
/* Anlama kontrolü */
.qcard{background:var(--sf2);border-radius:14px;padding:12px 14px;margin:6px 0 4px;font-size:14px}
.okmsg{display:flex;gap:10px;color:var(--up);background:var(--ups);border-radius:14px;padding:11px 13px;margin:12px 0 0;font-size:14px;font-weight:600}
/* Sözlük */
.gl dt{font-weight:700;margin-top:12px}.gl dd{margin:2px 0 0;color:var(--mu);font-size:14px}
/* Simülatör haber şeridi */
.news{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:12px}.news .nm{display:flex;align-items:center;gap:8px;margin-bottom:4px}.news .nl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}.news .nb{font-size:11px;font-weight:800;background:var(--tx);color:var(--sf);border-radius:8px;padding:2px 7px}.news .nt{margin:0;font-size:16px;font-weight:600;line-height:1.35;color:var(--tx)}.news .nall{margin:6px 0 0;padding:6px 0;min-height:32px;font-size:13.5px}
.news .nd{flex:none;font-size:11px;font-weight:700;color:var(--mu);background:var(--sf2);border-radius:8px;padding:3px 7px;margin-left:auto}
.news.neg{border-color:color-mix(in srgb,var(--dn) 35%,var(--ln));background:var(--dns)}
.news.fresh{animation:newsIn .5s ease-out}
@keyframes newsIn{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.news.fresh{animation:none}}
/* Simülatör sekmeleri: Piyasa grafikleri ve kriz çağrısı */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mcard{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--tx)}
.mcard b{font:700 15px var(--fd)}.mcard .mu{font-size:12px}
.salert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--dns);color:var(--dn);border:1px solid color-mix(in srgb,var(--dn) 40%,transparent);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.salert button{flex:none;border:0;border-radius:10px;background:var(--dn);color:var(--ink);font-weight:700;padding:8px 12px;cursor:pointer}
/* b25: serbest mod haber şeridi + hisse satırı işareti */
#sbanner{position:sticky;top:0;z-index:6}
.sbn{display:flex;align-items:stretch;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;margin:0 0 12px;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:newsIn .35s ease-out}
.sbn.neg{border-color:color-mix(in srgb,var(--dn) 45%,var(--ln));background:linear-gradient(var(--dns),var(--dns)),var(--sf)}
.sbn .sbt{flex:1;min-width:0;min-height:44px;border:0;background:none;text-align:left;padding:9px 6px 9px 12px;cursor:pointer;display:block}
.sbn .sbl{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.sbn .sbx{display:block;font-size:14px;font-weight:600;line-height:1.3;margin-top:2px}
.sbn .sbc{flex:none;width:44px;min-height:44px;border:0;background:none;font-size:22px;line-height:1;color:var(--mu);cursor:pointer}
.srow .rnw{display:inline-block;vertical-align:2px;margin-left:8px;font-size:11px;font-weight:800;line-height:1;background:var(--tx);color:var(--sf);border-radius:8px;padding:3px 7px}
.srow .rnw[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.sbn{animation:none}}
.ifacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 8px}.ifacts div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 8px;text-align:center}.ifacts b{display:block;font:700 18px var(--fd)}.ifacts span{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.how{list-style:none;margin:0;padding:0;counter-reset:hw}.how li{counter-increment:hw;position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px 12px 46px;margin-bottom:8px}.how li:before{content:counter(hw);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ln);color:var(--tx);font:700 13px var(--fd);display:flex;align-items:center;justify-content:center}.how li>b{display:block;font:700 15.5px var(--fd)}.how li>span{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.itabs{display:grid;gap:6px}.itabs div{display:flex;gap:10px;align-items:baseline;padding:2px 2px}.itabs b{flex:none;min-width:64px;font:700 15px var(--fd)}.itabs span{color:var(--mu);font-size:14px}
.rd{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:10px}.rd b{font:700 16px var(--fd)}.rd p{margin:4px 0 0;color:var(--mu);font-size:14.5px}
/* Simülatör hisse listesi: her hisse bir satır kartı. Üstte ad ve 1 lotun fiyatı; altta etiketli dört kutu (Lot, Ort. alış, Değer, Kâr/zarar).
   Hisse detayındaki pozisyon özeti de aynı kutuları kullanır. Bilgi içeriği eskisiyle aynı; yalnızca etiket ve düzen eklendi */
.shint{margin:0;padding:0 16px 10px;font-size:12.5px;color:var(--mu)}
.srow{display:block;width:100%;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);text-align:left;cursor:pointer;padding:14px 16px;font:inherit}
.shint+.srow{border-top:0}
.srow .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.srow .t1{display:block;font-weight:700;font-size:16px;min-width:0}
.srow .t1 small{display:block;font-weight:500;font-size:12.5px;color:var(--mu);margin:1px 0 0}
.srow .plb{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.srow .plb b{display:block;font-size:15px;font-weight:700;white-space:nowrap}
.srow .plb .pc{display:block;font-size:12.5px;font-weight:700;margin-top:1px;white-space:nowrap}
.srow .plb small{display:block;font-size:11.5px;color:var(--mu);margin-top:1px}
.srow .plb .up{color:var(--up)}.srow .plb .dn{color:var(--dn)}
/* Adet × fiyat = değer: üç sütun, aralarında işlem işareti */
.srow .eq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:6px;background:var(--sf2);border-radius:12px;padding:9px 10px;margin-top:10px}
.srow .eqc{min-width:0}
.srow .eqc i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .eqc b{display:block;font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .eqc.tot b{font-weight:800}
.srow .eqc.tot{text-align:right}
.srow .op{color:var(--mu);font-weight:700;font-size:15px;line-height:1.3;margin-bottom:0}
.srow .avgl{display:block;font-size:12.5px;color:var(--mu);margin-top:8px}
.srow .avgl b{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.cells.c3{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px}
.cell{background:var(--sf2);border-radius:10px;padding:7px 8px;min-width:0}
.term{font:inherit;color:inherit;background:none;border:0;padding:3px;margin:-3px;text-align:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cell .term{padding:6px 3px;margin:-6px -3px}
.term:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:3px}
.cell i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--mu);white-space:nowrap}
.cell b{display:block;font-size:13.5px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .pc{display:block;font-size:11.5px;font-weight:600;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell b.up,.cell .pc.up{color:var(--up)}.cell b.dn,.cell .pc.dn{color:var(--dn)}
@media (max-width:379px){.cells{grid-template-columns:repeat(2,minmax(0,1fr))}.cells.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.cells.c3 .cell b{font-size:12.5px}}
.pos{margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}
.pos .ph{font-weight:700;font-size:13.5px;margin-bottom:2px}
.unit{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.kv .fx{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-top:1px}
/* Portföy dağılımı */
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 8px}.alloc i{display:block;height:100%;transition:width .4s}
.alegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu)}.alegend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}.alegend i{width:9px;height:9px;border-radius:3px;display:inline-block}
/* Hisse detay sayfası */
.dhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.rng{display:flex;gap:6px;margin:8px 0 4px}.rng button{flex:1;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:7px 0;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--mu)}.rng button.on{background:var(--acs);border-color:var(--ac);color:var(--act)}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.hist .kv{align-items:flex-start;gap:8px}
/* İşlem penceresi: Sat/Al seçimi, lot kutusu, hızlı oranlar, özet. İki yön de aynı görünümde (biri "öne çıkarılmaz") */
#modal .box{max-height:calc(100% - 8px);overflow-y:auto}
#mbox:focus{outline:none}
.tside{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sf2);border-radius:12px;padding:4px;margin:12px 0 10px}
.tside button{border:0;background:none;border-radius:9px;padding:10px 0;font-weight:700;font-size:15px;cursor:pointer;color:var(--mu)}
.tside button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.qlab{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.qrow{display:flex;gap:8px;align-items:center}
.qrow .qb{width:48px;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);font-size:22px;cursor:pointer;color:var(--tx);flex:none}
.qrow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);text-align:center;font:700 22px var(--fd)}
.qrow input::placeholder{color:var(--mu2);font-weight:600}
.qchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.qchips button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 0;font-weight:700;font-size:13px;cursor:pointer;color:var(--mu)}
.qchips button:disabled,.qrow .qb:disabled{opacity:.4;cursor:not-allowed}
.tsum{background:var(--sf2);border-radius:12px;padding:6px 12px;margin:6px 0 12px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
/* Genel ilerleme çubuğu: 5 adım, geçerli adım kısmen dolu */
#gp{flex:none;padding:0 16px 8px}
#gp .gs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#gp .gb{height:4px;border-radius:2px;background:var(--ln);overflow:hidden}
#gp .gb i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .5s}
#gp .gl{font-size:10.5px;color:var(--mu2);margin-top:4px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gp .gl.cur{color:var(--tx);font-weight:800}#gp .gl.done{color:var(--mu)}
/* Katmanlı onam */
.csum{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.csum svg{flex:none;width:24px;height:24px;color:var(--act);margin-top:1px}
.csum b{display:block;font:700 15px var(--fd);margin-bottom:2px}.csum span{color:var(--mu);font-size:14px;line-height:1.45}
.cdet{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:0 14px;margin-bottom:8px}
.cdet summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cdet summary::-webkit-details-marker{display:none}
.cdet summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s;margin-right:4px;flex:none}
.cdet[open] summary::after{transform:rotate(-135deg)}
.cdet p{margin:0 0 10px;color:var(--mu);font-size:14px;line-height:1.5}.cdet p:last-child{margin-bottom:14px}
.cchk{display:flex;gap:12px;align-items:flex-start;margin:14px 0 4px;cursor:pointer;font-size:14.5px;line-height:1.45}
.cchk input{flex:none;width:24px;height:24px;margin-top:1px;accent-color:var(--ac)}
.todo{background:#FFE58A;color:#3A2A00;border-radius:4px;padding:0 4px;font-weight:600}
@media (prefers-reduced-motion:reduce){#gp .gb i{transition:none}}
#qb,#db{flex:none;margin:0 16px 8px;padding:5px 10px;border-radius:10px;background:var(--wr);color:var(--wt);font-size:11px;font-weight:800;letter-spacing:.02em;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* İnce hareket: ekran geçişinde yumuşak belirme, pencere yükselmesi, düğme basma geri bildirimi. Uyaranı, süreleri ve
   fiyat gösterimini değiştirmez; iki gruba da aynıdır. Fiyatlar her turda değiştiği için fiyata hareket EKLENMEDİ. Hareket azaltma açıksa kapalı. */
@keyframes vIn{from{opacity:0}to{opacity:1}}
@keyframes boxIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#view.enter{animation:vIn .22s ease-out}
#disc{flex:none;margin:0;padding:3px 16px 4px;text-align:center;font-size:11px;line-height:1.3;color:var(--mu2)}
#modal.open .box{animation:boxIn .22s cubic-bezier(.2,.9,.3,1)}
.btn,.chip,.choice,.opt,.srow{transition:transform .12s ease,background-color .15s ease,border-color .15s ease}
.btn:active:not(:disabled),.chip:active,.choice:active,.opt:active,.srow:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){#view.enter,#modal.open .box{animation:none}.btn:active:not(:disabled),.chip:active,.choice:active,.opt:active,.srow:active{transform:none}}
/* Grafikte parmakla gezme: dikey kaydırma çalışır, yatay hareket grafiğe gider */
#dchart svg{touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
/* 320 px gibi dar ekranlarda (normal yazı boyutunda bile) üst çubuk 4-5 düğmeyle sığmıyordu: alt satıra geçer */
@media (max-width:359px){header{flex-wrap:wrap}.brand b{display:none}}
/* b22: zoom ile etkin genişlik daralır ama medya sorgusu gerçek genişliğe bakar; üst çubuk için aynı daraltma yazı boyutu seçilince de uygulanır */
html[data-fs] header{flex-wrap:wrap}html[data-fs] .brand b{display:none}
html[data-fs] .hr{gap:5px}html[data-fs] .score{padding:6px 8px}
.fsel{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.fsel .fsl{flex:0 0 100%;font-size:13px;font-weight:700;color:var(--mu)}
.fsel .chip{flex:1 1 0;min-width:0;padding:8px 6px;min-height:40px;white-space:nowrap}
/* b22: yazı boyutu (katılımcı tercihi; tarayıcı yakınlaştırması gibi yalnızca görünümü büyütür) */
html[data-fs="1"]{zoom:1.15}
html[data-fs="2"]{zoom:1.3}
.chip:disabled{opacity:.45;cursor:default}
.fsel.wrap .chip{flex:1 1 auto;white-space:normal;line-height:1.15}
.fsz{margin:6px 0 12px}
.fsz .fsel{margin:0}
.fsz .chip{font-size:13px}
.fsel .chip[data-a=fs]{white-space:normal;line-height:1.15;padding:8px 4px}
</style>
</head>
<body>
<div id="app">
