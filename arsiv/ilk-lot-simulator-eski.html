<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İlk Lot: araştırma pilot sürümü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
/* Akademik açık tema varsayılan: kâğıt zemin, lacivert eylem.
   Anlam ayrımı: --pr = eylem (düğmeler), --wr/--wt = uyarı (amber), --up/--dn = fiyat yönü.
   Eylem ve uyarı artık aynı renk değil; Al ve Sat aynı renkte (satış "tehlikeli" gibi kodlanmaz). */
:root{
  --bg:#F6F4EF;--sf:#FFFFFF;--sf2:#EFEBE3;--ln:#E2DCD0;
  --tx:#16213A;--mu:#5A6378;--mu2:#8C93A3;
  --ac:#16213A;--acs:rgba(22,33,58,.08);--act:#16213A;--ink:#F6F4EF;
  --pr:#16213A;--onpr:#F6F4EF;--fl:#B9770E;
  --cfx:inset 0 0 34px 2px rgba(194,65,45,.30),inset 0 0 0 2px rgba(194,65,45,.55);--pend:#C98A1B;
  --up:#1E8A5E;--ups:rgba(30,138,94,.1);--dn:#C2412D;--dns:rgba(194,65,45,.09);
  --wr:#FCEFD6;--wt:#7A4B00;
  --shadow:0 -14px 44px rgba(22,33,58,.16);
  --fd:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Koyu tema: sadece tema düğmesiyle (ya da görüntüleyici data-theme="dark" verirse). Aynı anlam ayrımı korunur */
:root[data-theme="dark"]{
  --bg:#0F1522;--sf:#161E2F;--sf2:#1E2840;--ln:#2A3550;
  --tx:#EEF1F7;--mu:#97A1B8;--mu2:#66718A;
  --ac:#E9E4D8;--acs:rgba(233,228,216,.12);--act:#E9E4D8;--ink:#16213A;
  --pr:#E9E4D8;--onpr:#16213A;--fl:#F2A93B;
  --cfx:inset 0 0 70px 12px rgba(255,70,55,.55),inset 0 0 0 2px rgba(255,90,70,.5);--pend:#F2A93B;
  --up:#3FD08F;--ups:rgba(63,208,143,.13);--dn:#FF6B5B;--dns:rgba(255,107,91,.13);
  --wr:rgba(242,169,59,.13);--wt:#F6C979;
  --shadow:0 -14px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer}
.brand b{font:700 20px/1 var(--fd);letter-spacing:-.4px}
.hr{display:flex;align-items:center;gap:8px}
.score{font-size:12px;font-weight:700;color:var(--act);background:var(--acs);padding:6px 11px;border-radius:999px}
.icon{width:36px;height:36px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);display:grid;place-items:center;padding:0;cursor:pointer;font-size:18px;line-height:1;flex:none}
main{flex:1;overflow-y:auto;padding:2px 16px 28px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;gap:2px;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px 8px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu2);font-size:11px;font-weight:600;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}

#toast{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
/* Hisse ekranı açıkken bildirim üste çıkar, Al/Sat ve Vazgeç düğmelerini kapatmasın */
#toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}

/* Portföy değeri sayfanın tek "büyük" öğesi: dikkat önce buraya gitsin */
.hero{padding:10px 2px 18px}
.hero .lbl{color:var(--mu);font-size:13px}
.hero .val{font:750 46px/1.02 var(--fd);letter-spacing:-1.8px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--ups);color:var(--up)}.pill.dn{background:var(--dns);color:var(--dn)}
.hsub{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mu)}
.hsub b{display:block;color:var(--tx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

.seg{display:flex;gap:4px;background:var(--sf2);border-radius:14px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:600;font-size:13.5px;padding:10px 6px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.seg.sm button{font-size:12px;padding:8px 4px}

.sec{background:var(--sf);border:1px solid var(--ln);border-radius:20px;margin-bottom:14px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 16px 6px}
.sh h3{margin:0;font:700 17px/1.2 var(--fd);letter-spacing:-.2px}
.sb{padding:6px 16px 16px}
.sb p{margin:6px 0 0}

.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;border-top:1px solid var(--ln);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.sh+.row,.sh+.list .row:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font:700 12px var(--fd);color:var(--mu);flex:none;letter-spacing:.2px}
.rm{flex:1;min-width:0;display:block}
.rm .s{display:block;font-weight:700}
.rm .n{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:block;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rr .rp{display:block;font-weight:600}
.rr .rc{display:block;font-size:12.5px;font-weight:600}
.rs{flex:none;display:block;line-height:0}
.chev{width:8px;height:8px;border-right:2px solid var(--mu2);border-top:2px solid var(--mu2);transform:rotate(45deg);flex:none;margin-right:4px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.t-up{background:var(--ups);color:var(--up)}.t-dn{background:var(--dns);color:var(--dn)}.t-h{background:var(--wr);color:var(--wt)}

.btn{display:block;width:100%;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);border-radius:14px;padding:15px 16px;font-weight:700;font-size:15px;cursor:pointer;text-align:center}
.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--onpr)}
.btn.danger{background:var(--dn);border-color:var(--dn);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn+.btn{margin-top:10px}
.link{background:none;border:0;color:var(--mu);font-weight:600;padding:10px;cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:var(--sf2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--act)}

.note{display:flex;gap:10px;background:var(--wr);color:var(--wt);border-radius:16px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.note b{color:inherit}
.note.info{background:var(--sf2);color:var(--mu)}
.foot{text-align:center;color:var(--mu2);font-size:12px;margin:10px 0 0}

.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .4s}
.met{margin-top:14px}
.met .mh{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat span{display:block;color:var(--mu);font-size:12px}
.stat b{display:block;font:700 20px/1.2 var(--fd);margin-top:2px;font-variant-numeric:tabular-nums}
.field{width:100%;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:0 14px;font:inherit}
.field::placeholder{color:var(--mu2)}

/* Alt pencere (hisse ekranı) */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(3,6,14,.58);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:94%;overflow-y:auto;background:var(--sf);border-top:1px solid var(--ln);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
#sheet.open{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 12px}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shh .t{font:700 20px/1.1 var(--fd)}
.sp{font:750 36px/1.05 var(--fd);letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin-top:12px}
.lab{display:block;color:var(--mu);font-size:13px;margin:14px 0 6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper>button{width:48px;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);font-size:22px;cursor:pointer;flex:none}
.stepper input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);text-align:center;font:700 20px var(--fd)}
.stepper .btn.sm{height:48px}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--mu)}
.kv b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.kvs{margin:12px 0}
details.more{border-top:1px solid var(--ln);margin-top:14px}
details.more+details.more{margin-top:0}
details.more summary{list-style:none;cursor:pointer;padding:15px 2px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more>div{padding:0 2px 14px}
.q{font-weight:700;margin:18px 0 10px}
.big-sum{font:700 24px/1.2 var(--fd);letter-spacing:-.4px;margin:14px 0 4px}
.count{font:800 64px/1 var(--fd);text-align:center;margin:18px 0;font-variant-numeric:tabular-nums}

/* Karşılama, test ve tanıtım ekranları */
.stage{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:18px 4px 8px}
.stage h1{font:750 32px/1.08 var(--fd);letter-spacing:-.9px;margin:20px 0 12px}
.stage p{color:var(--mu);margin:0 0 12px}
.stage .act{margin-top:18px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--ln);transition:width .2s}
.dots i.on{width:24px;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer}
.opt.ok{border-color:var(--up);background:var(--ups)}
.opt.no{border-color:var(--dn);background:var(--dns)}
.giant{font:800 52px/1 var(--fd);letter-spacing:-2px;color:var(--ac);font-variant-numeric:tabular-nums}

.wrapc{background:linear-gradient(160deg,#1C2A4A,#101827);color:#F1EEE6;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #2A3A60}
.wrapc .k{font:800 34px/1.05 var(--fd);color:#F2A93B;margin:8px 0 6px;letter-spacing:-.8px}
.wrapc .l{margin-top:7px;font-size:14px;color:#D8DCE6}
.gauge-t{text-align:center;color:var(--mu);font-size:13.5px;margin:4px 0 0}
pre.json{font-size:11px;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;color:var(--mu);background:var(--bg);border-radius:12px;padding:10px}
/* Modal: kriz sonrası soru ve onay pencereleri. Hisse ekranının da üstünde durur */
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.66)}
#modal.open{display:flex}
#modal .box{width:100%;max-width:400px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h2{font:750 24px/1.15 var(--fd);letter-spacing:-.5px;margin:0 0 8px}
#modal p{color:var(--mu);margin:0 0 14px}
.scale{display:flex;gap:6px}.scale button{flex:1;height:52px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);font:700 18px var(--fd);cursor:pointer}
.scale-l{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin:6px 2px 0}
.btn.ghost-dn{background:none;border-color:var(--dn);color:var(--dn)}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.steps i.on{background:var(--ac)}
/* Kayıt durumu noktası: yeşil = kaydedildi, sarı = gönderiliyor, kırmızı = bağlantı yok */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--up)}
.dot.pend{background:var(--pend)}.dot.err{background:var(--dn);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.q2{font-weight:700;margin:20px 0 8px}
/* ── Kriz atmosferi: ekran kenarlarında kırmızı nabız. Tıklamayı engellemez ── */
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:0;transition:opacity .6s;
  box-shadow:var(--cfx)}
#app.crisis::after{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
/* Düşen fiyat anlık kırmızı parlar ve hafifçe titrer */
.fl{animation:fl .6s ease-out}
@keyframes fl{0%{color:#fff;background:rgba(255,80,60,.55);transform:translateX(-2px)}25%{transform:translateX(2px)}50%{transform:translateX(-1px)}100%{background:transparent;transform:none}}
.rp{border-radius:6px;padding:0 3px;margin-right:-3px}
/* ── Kararlarının filmi ── */
.film{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px 12px 12px;margin:6px 0 14px;color:var(--tx)}
:root[data-theme="dark"] .film{background:linear-gradient(180deg,#161E2F,#111827)}
.film .ft{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.film .ft b{font:700 17px var(--fd)}
.film .cap{min-height:40px;padding:8px 6px 0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.film .cap i{width:8px;height:8px;border-radius:50%;flex:none}
.film .lg{display:flex;gap:14px;font-size:11.5px;color:var(--mu);padding:6px 4px 0;flex-wrap:wrap}
.film .lg span{display:inline-flex;align-items:center;gap:5px}
.mk{transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
.mk.off{opacity:0;transform:scale(.2)}
@media (prefers-reduced-motion:reduce){#app.crisis::after{animation:none;opacity:.7}.fl{animation:none}.mk{transition:none}}
/* ── Araştırmacı panosu ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.kpi{background:var(--sf2);border-radius:16px;padding:12px 14px}
.kpi span{display:block;color:var(--mu);font-size:12px}
.kpi b{display:block;font:750 28px/1.1 var(--fd);letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;color:var(--mu);font-size:12px;font-weight:600}
.flag{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.flag:first-child{border-top:0}
.flag code{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
/* Hata kutusu: ".stage p" gri rengini ezmesi için daha belirgin seçici. Her basışta sallanır ki tepki görülsün */
.stage .err,.err{display:flex;gap:10px;align-items:flex-start;color:var(--dn);background:var(--dns);border:1px solid color-mix(in srgb,var(--dn) 45%,transparent);border-radius:14px;padding:11px 13px;margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.4}
.err::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--dn);color:#fff;font:800 13px/20px var(--fb);text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="brand" data-a="logo" aria-label="İlk Lot">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#16213A"/><rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3A4666" stroke-width="2"/><circle cx="32" cy="42" r="14" fill="#F2A93B"/><text x="32" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#16213A">₺</text><line x1="32" y1="28" x2="32" y2="19" stroke="#4FC795" stroke-width="3" stroke-linecap="round"/><path d="M32 22 C24 22 21 16 21 13 C28 13 32 17 32 22Z" fill="#4FC795"/><path d="M32 22 C40 22 43 16 43 13 C36 13 32 17 32 22Z" fill="#4FC795"/></svg>
      <b>İlk Lot</b>
    </button>
    <div class="hr">
      <button class="icon" id="bk" data-a="back" aria-label="Geri" hidden>‹</button>
      <span class="score num" id="tm" hidden style="color:var(--mu);background:var(--sf2)"><span id="tmt"></span><i id="sdot" class="dot" role="img"></i></span>
      <button class="icon" data-a="theme" aria-label="Temayı değiştir">◐</button>
    </div>
  </header>
  <div id="toast" role="status" aria-live="polite"></div>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div id="scrim" data-a="closeS"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Hisse işlemi"></div>
  <div id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>
</div>
<script>
'use strict';
// Her olay ve anlık görüntü bu sürümle etiketlenir. Pilot ortasında kodu değiştirirsen MUTLAKA artır;
// böylece hangi verinin hangi sürümden geldiği ayrılabilir.
var APP_VERSION='2026.10.03-10';

// ═════════════════ TOHUMLU RASTGELELİK ═════════════════
// Math.random her katılımcıya farklı piyasa üretiyordu. Artık tüm rastgelelik bu tek akıştan gelir:
// aynı oturum + aynı tick = herkes için aynı fiyat, aynı haber, aynı devre kesici.
function seedOf(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}

function rnd(){_rs=(_rs+0x6D2B79F5)>>>0;var t=_rs;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}

function fmt(n,d){d=d==null?2:d;n=Number(n);if(Math.abs(n)<0.5*Math.pow(10,-d))n=0;return n.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function r2(v){return Math.round(v*100)/100}
function sgn(v){return r2(v)>=0?'+':''}
function cls(v){return r2(v)>=0?'up':'dn'}
function chg(v){var r=r2(v);return (r>0?'▲ ':r<0?'▼ ':'')+fmt(Math.abs(v))+'%'}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function hist(sym,p0){var h=0,i;for(i=0;i<sym.length;i++)h=(h*31+sym.charCodeAt(i))>>>0;var a=[p0],p=p0,seed=h||1,dr=((h%13)-5)/4000;
function r(){seed=(seed+0x6D2B79F5)>>>0;var t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
for(i=0;i<125;i++){p=p/(1+dr+(r()-0.5)*0.03);a.unshift(p)}return a}
function XT(){return [['PGSUS','Havayolu',180,320],['TCELL','Telekom',80,130],['TOASO','Otomotiv',200,330],['ARCLK','Beyaz eşya',120,210],['VESTL','Elektronik',40,95],['ENKAI','İnşaat',55,95],['SASA','Kimya',3,9],['HEKTS','Tarım kimya',2,6],['KRDMD','Demir çelik',20,45],['PETKM','Petrokimya',15,30],['TTKOM','Telekom',40,80],['ISCTR','Banka',12,30],['YKBNK','Banka',25,50],['VAKBN','Banka',18,40],['MGROS','Perakende',300,650]].map(function(a){return [a[0],a[1],Math.round((a[2]+rnd()*(a[3]-a[2]))*100)/100]})}
function BRS(){return ['Alfa Menkul','Beta Yatırım','Gama Menkul','Delta Yatırım','Epsilon Menkul','Zeta Capital','Eta Yatırım','Teta Menkul','Iota Securities','Kapa Yatırım']}
function akdInit(p0){var u=Math.round(20000/p0)+20,o={u:u,m:{}};BRS().forEach(function(b){o.m[b]={b:Math.round(rnd()*u*40),s:Math.round(rnd()*u*40)}});return o}
function akdTick(x,d){var o=x.akd,br=BRS(),pr=Math.min(0.85,Math.max(0.15,0.5+d*20));for(var i=0;i<3;i++){var b=br[Math.floor(rnd()*br.length)];o.m[b][rnd()<pr?'b':'s']+=Math.round(o.u*(1+rnd()*8))}}

S.cash=100000;S.pos={};S.trades=[];S.orders=[];S.fees=0;S.nt=0;S.cd=null;S.ended=false;S.endedAt=null;S.goal=null;S.sl=0;S.slSet=0;

function bySym(k){for(var i=0;i<S.stocks.length;i++)if(S.stocks[i].s===k)return S.stocks[i]}
function price(k){return bySym(k).p}
function total(){var t=S.cash;for(var k in S.pos)t+=S.pos[k].q*price(k);return t}
function plPct(){return (total()-100000)/1000}
function dayCh(x){return (x.p/x.p0-1)*100}

// Skor/karakter hesapları uygulama içi geri bildirim içindir.

function M(){var sells=S.trades.filter(function(t){return t.side==='S'});
var pa=Math.min(100,sells.filter(function(t){return t.pl<=-0.02&&t.src!=='o'}).length*35);
var ov=Math.min(100,Math.max(0,S.trades.length-5)*12);
var ho=Math.min(100,Object.keys(S.pos).filter(function(k){return S.pos[k].q>0&&(price(k)-S.pos[k].avg)/S.pos[k].avg<=-0.05}).length*35);
var risk=Math.round((pa+ov+ho)/3),n=S.trades.length,ls=Object.keys(S.done).length/LES.length*100;
var sc=Math.round(ls*0.4+(n>=3?(100-risk)*0.6:0));
var ch='Henüz yeterli işlem yok',tip='En az 3 işlem yap, davranışını analiz edelim.';
if(n>=3){if(pa>=35){ch='Panikçi';tip='Zararına satışlar öne çıkıyor. Satmadan önce 10 saniye dur ve nedenini yaz.'}else if(ov>=36){ch='Aşırı işlemci';tip='Çok sık işlem yapıyorsun. Her işlem için bir gerekçe belirle.'}else if(ho>=35){ch='Zarar inatçısı';tip='Kaybeden pozisyonları tutuyorsun. Zarar kesme seviyesi koy.'}else{ch='Soğukkanlı';tip='Kararların dengeli. Bir sonraki kriz senaryosunda sınanacaksın.'}}
return{pa:pa,ov:ov,ho:ho,risk:risk,sc:sc,ch:ch,tip:tip,n:n}}
function dist(){var d={};S.trades.forEach(function(t){if(t.why)d[t.why]=(d[t.why]||0)+1});return d}

// ═════════════════ İŞLEM MOTORU ═════════════════
function exec(x,side,q,p,src){var o=S.pos[x.s]||{q:0,avg:0},f=p*q*CM;
if(side==='B'){if(p*q+f>S.cash)return 'Nakit yetmiyor.';S.cash-=p*q+f;o.avg=(o.avg*o.q+p*q)/(o.q+q);o.q+=q;S.pos[x.s]=o;S.trades.push({sym:x.s,side:'B',q:q,t:S.tick,p:p,src:src})}
else{if(o.q<q)return 'Elinde yeterli hisse yok.';
// Elden çıkarma etkisi (Odean, 1998) için: satış anında ELDE TUTULAN diğer pozisyonlar kâğıt üzerinde kârda mı zararda mı?
var pg=0,pls=0;for(var k in S.pos){if(k===x.s)continue;var c=price(k),a=S.pos[k].avg;if(c>a)pg++;else if(c<a)pls++}
S.cash+=p*q-f;S.trades.push({sym:x.s,side:'S',q:q,pl:(p-o.avg)/o.avg,t:S.tick,p:p,src:src,dp:{pg:pg,pl:pls}});o.q-=q;if(!o.q)delete S.pos[x.s];else S.pos[x.s]=o}
S.fees+=f;S.nt++;var mm=x.akd.m['Sen (sanal)']||(x.akd.m['Sen (sanal)']={b:0,s:0});mm[side==='B'?'b':'s']+=q;return ''}

function chkOrd(){S.orders=S.orders.filter(function(o){var x=bySym(o.sym);if(x.halt>S.tick)return true;
var hit=o.k==='LB'?x.p<=o.px:o.k==='LS'?x.p>=o.px:x.p<=o.px;if(!hit)return true;
var e=exec(x,o.k==='LB'?'B':'S',o.q,x.p,'o');
if(!e){var t=S.trades[S.trades.length-1];t.why='Plan';if(o.k==='SL')S.sl=1;log('trade',tradeLog(t,{order:o.k,orderId:o.id}))}
else log('order_fail',{id:o.id,k:o.k,sym:o.sym,reason:e});

function tradeLog(t,extra){var o={paperGains:t.dp?t.dp.pg:null,paperLosses:t.dp?t.dp.pl:null,sym:t.sym,side:t.side,q:t.q,p:r2(t.p),pl:t.pl!=null?Math.round(t.pl*10000)/10000:null,src:t.src,why:t.why||null,mood:t.mood||null,crowdSell:t.cw!=null?r2(t.cw):null,cash:r2(S.cash),total:r2(total()),inCrisis:!!(S.crisis&&S.tick<=S.crisis.end)};for(var k in extra||{})o[k]=extra[k];return o}

// ═════════════════ PİYASA ADIMI ═════════════════
// Kullanıcı eylemlerinden bağımsızdır: sadece tick sırasına ve tohuma bağlı.
// Bu sayede kaldığı yerden devam eden katılımcı için piyasa aynen yeniden üretilebilir.
function stepMarket(){S.tick++;
var al=S.al;al.g=(1+al.g)*(1+(rnd()-0.5)*0.006)-1;al.u=(1+al.u)*(1+0.0002+(rnd()-0.5)*0.002)-1;al.m=(1+al.m)*1.00004-1;al.e=(1+al.e)*1.00006-1;
// start bir önceki tick: dizinin ilk adımı (seq[0]) bu tick'te uygulanır. Eskiden -1. eleman okunup fiyatlar NaN oluyordu
CFG.crises.forEach(function(c){if(c.at===S.tick){var q=SC[c.id];S.crisis={id:c.id,start:S.tick-1,end:S.tick-1+q.length,seq:q};S.crisisRes=null;note('Piyasada sert hareket başladı. Planına göre davran.');log('crisis_start',{id:c.id});if(!S.replay&&CFG.crisisFx&&navigator.vibrate)try{navigator.vibrate([90,70,90])}catch(e){}}});
S.stocks.forEach(function(x){var c=S.crisis&&S.tick<=S.crisis.end?S.crisis.seq[S.tick-S.crisis.start-1]/100:0;
if(x.halt>S.tick){x.h.push(x.p);if(x.h.length>30)x.h.shift();return}
if(x.halt){x.halt=0;x.p=x.p*(1+(rnd()-0.5)*0.01);x.ref=x.p;note(x.s+' devre kesici sonrası işleme açıldı.')}
var pv=x.p;
// Ortalamaya dönüş terimi kaldırıldı: fiyat artık düşüşten kendiliğinden toparlanmaya çekilmiyor
x.p=Math.max(1,x.p*(1+c+(rnd()-0.5)*CFG.noise));
var dv=x.p/x.ref-1;if(Math.abs(dv)>=BK){x.p=x.ref*(1+(dv>0?BK:-BK));x.halt=S.tick+HT;note(x.s+' için devre kesici tetiklendi.');log('halt',{sym:x.s,dir:dv>0?1:-1})}
lim(x);akdTick(x,x.p/pv-1);x.cs=Math.min(0.92,Math.max(0.08,x.cs+(0.5-x.cs)*0.04-(x.p/pv-1)*6+(rnd()-0.5)*0.03));
x.h.push(x.p);if(x.h.length>30)x.h.shift()});
if(S.crisis&&S.tick===S.crisis.end+1){S.crisisRes={id:S.crisis.id,sold:S.trades.filter(function(t){return t.side==='S'&&t.t>=S.crisis.start&&t.t<=S.crisis.end+1}).length};log('crisis_end',S.crisisRes);
// Kriz bitince duygu sorusu sorulacak (yeniden oynatmada sorulmaz)
if(!S.replay&&!S.pulses[S.crisis.id])S.pulseDue=S.crisis.id}
S.series.ix[S.tick]=Math.round(ixv()*10)/10;S.ih.a.push(ixv());S.ih.b.push(ixv(B30));if(S.ih.a.length>80){S.ih.a.shift();S.ih.b.shift()}
// Haber: aynı tohumdan, herkese aynı tick'te
if(rnd()<=0.06){var hh=new Date().toLocaleTimeString('tr-TR').slice(0,5),n;
if(rnd()<0.25){var up=rnd()<0.5;S.stocks.forEach(function(x){if(!(x.halt>S.tick)){x.p*=1+(up?0.015:-0.015);lim(x)}});n={t:S.tick,h:hh,txt:'Merkez Bankası faiz kararı '+(up?'olumlu karşılandı':'piyasayı sarstı'),d:up?1.5:-1.5}}
else{var x=S.stocks[Math.floor(rnd()*S.stocks.length)],e=NW[Math.floor(rnd()*NW.length)];if(rnd()<0.3)e=rnd()<0.7?['sürpriz ihale kazandı',0.1]:['beklenmedik zarar açıkladı',-0.1];if(!(x.halt>S.tick)){x.p*=1+e[1];lim(x);if(Math.abs(e[1])>=0.1)x.ref=x.p}n={t:S.tick,h:hh,txt:x.s+': '+e[0],d:e[1]*100}}
S.news.unshift(n);S.news=S.news.slice(0,5);note('Haber: '+n.txt);log('news',{txt:n.txt,d:n.d})}}

			this.modules[row] = new Array(this.moduleCount);

		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);

			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) ||

						if (Math.abs(r) === 2 ||

		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}

		var bits = QRUtil.getBCHTypeInfo(data);

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

// Katılımcı özeti: oturum bazında, oran olarak tanımlı ana değişkenlerle

function summarizeSnap(code,grp,sess,sn){var T=sn.trades||[],man=T.filter(function(t){return t.src==='m'}),ms=man.filter(function(t){return t.side==='S'}),ps=ms.filter(function(t){return t.pl<=-0.02});

// Elden çıkarma etkisi: PGR = RG/(RG+PG), PLR = RL/(RL+PL), DE = PGR − PLR (Odean, 1998). Tüm satışlar (elle + emirle)
var sells=T.filter(function(t){return t.side==='S'}),RG=sells.filter(function(t){return t.pl>0}).length,RL=sells.filter(function(t){return t.pl<0}).length,
PG=sells.reduce(function(a,t){return a+(t.dp?t.dp.pg:0)},0),PL=sells.reduce(function(a,t){return a+(t.dp?t.dp.pl:0)},0),
pgr=RG+PG?RG/(RG+PG):null,plr=RL+PL?RL/(RL+PL):null,de=pgr!=null&&plr!=null?pgr-plr:null,r4=function(v){return v==null?'':Math.round(v*10000)/10000};

var med=function(a){a=a.filter(function(v){return v!=null}).sort(function(x,y){return x-y});return a.length?(a.length%2?a[(a.length-1)/2]:Math.round((a[a.length/2-1]+a[a.length/2])/2)):''},
dm=function(f){return med(man.filter(function(t){return t.dec&&!t.dec.hid&&f(t)}).map(function(t){return t.dec.ms}))};
// Krize tepki süresi: kriz başlangıcından ilk ELLE satışa kadar geçen piyasa süresi (sn). Pencere: kriz + 30 sn. Satış yoksa boş
var lat=function(id){var c=CFG.crises.filter(function(c){return c.id===id})[0];if(!c)return '';var w=c.at+SC[id].length+20,f=ms.filter(function(t){return t.t>=c.at&&t.t<=w})[0];return f?r2((f.t-c.at)*1.5):''};
return [sn.v||'',code,grp,sess,sn.tick,sn.ended?1:0,T.length,man.length,ms.length,ps.length,ms.length?r2(ps.length/ms.length):'',r2(man.length/Math.max(1,sn.tick)*40),T.filter(function(t){return t.mood}).length?r2(T.filter(function(t){return t.mood}).reduce(function(a,t){return a+t.mood},0)/T.filter(function(t){return t.mood}).length):'',cd.n,cd.v,cd.g,Object.keys(sn.done||{}).length,r2(sn.cash),r2(inv),pu.k18?pu.k18.v:'',pu.p20?pu.p20.v:'',RG,RL,PG,PL,r4(pgr),r4(plr),r4(de),dm(function(t){return t.side==='B'}),dm(function(t){return t.side==='S'}),dm(function(t){return t.side==='S'&&t.pl<0}),lat('k18'),lat('p20'),sn.updatedAt]}
async function exportParticipants(){var ps=await Store.listP(),rows=[['app_version','code','grp','session','ticks','ended','trades_total','trades_manual','sells_manual','panic_sells','panic_rate','manual_trades_per_minute','mood_avg','cooldown_shown','cooldown_cancel','cooldown_proceed','lessons_done','cash_end','invested_cost_end','stress_after_k18','stress_after_p20','realized_gains','realized_losses','paper_gains','paper_losses','pgr','plr','disposition_effect','decision_ms_median_buy','decision_ms_median_sell','decision_ms_median_loss_sell','k18_first_sell_s','p20_first_sell_s','updated_at','pre','post','attention_pass','manip_saw_wait','age','gender','field','year','invest_exp','sim_exp']];

function spark(h,up){var w=56,hh=22,mn=Math.min.apply(0,h),mx=Math.max.apply(0,h),r=(mx-mn)||1;

function gc(v){return v<35?'var(--dn)':v<70?'var(--ac)':'var(--up)'}
function gauge(v){var a=Math.PI*(1-v/100),cx=110,cy=104,r=84,x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);

// ───────────────── Oturum sonu ve bilgilendirme ─────────────────
// ───────────────── Kararlarının filmi ─────────────────
// Oturum bittikten SONRA gösterilir; o oturumun verisini etkilemez. İki gruba da aynıdır.
// Grafik: endeks (gri) ve portföy (amber), yüzde değişim olarak. Kriz anları kırmızı bant, işlemler nokta.
var FW=340,FH=170,FP={l:6,r:6,t:14,b:18};
function filmData(){var ix=S.series.ix,pv=S.series.pv,T=Math.max(1,S.tick),a=[],b=[],last=100000;
for(var t=0;t<=T;t++){var x=ix[t]!=null?ix[t]:(a.length?10000*(1+a[a.length-1]/100):10000);if(pv[t]!=null)last=pv[t];a.push((x/10000-1)*100);b.push((last/100000-1)*100)}
var mn=Math.min(Math.min.apply(0,a),Math.min.apply(0,b),-0.5),mx=Math.max(Math.max.apply(0,a),Math.max.apply(0,b),0.5),pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
var X=function(t){return FP.l+(FW-FP.l-FP.r)*t/T},Y=function(v){return FP.t+(FH-FP.t-FP.b)*(1-(v-mn)/(mx-mn))};
var P=function(arr){return arr.map(function(v,t){return (t?'L':'M')+X(t).toFixed(1)+' '+Y(v).toFixed(1)}).join('')};
var trades=S.trades.filter(function(t){return t.t<=T}).map(function(tr){return {t:tr.t,x:X(tr.t),y:Y(b[Math.min(tr.t,T)]),side:tr.side,sym:tr.sym,pl:tr.pl,src:tr.src}});
var cr=CFG.crises.filter(function(c){return c.at<=T}).map(function(c){var len=SC[c.id].length;return {at:c.at,end:c.at+len-1,x1:X(c.at-1),x2:X(Math.min(T,c.at+len-1)),id:c.id}});
return {T:T,a:a,b:b,X:X,Y:Y,pa:P(a),pb:P(b),y0:Y(0),trades:trades,cr:cr}}
// Altyazı: o ana kadar yaşanan son önemli olay
function filmCap(d,t){var ev=[];d.cr.forEach(function(c){ev.push({t:c.at,txt:'Piyasada sert düşüş başladı',col:'var(--dn)'});ev.push({t:c.end+1,txt:'Düşüş sona erdi',col:'var(--mu)'})});
d.trades.forEach(function(tr){ev.push({t:tr.t,txt:tr.sym+' '+(tr.side==='B'?'aldın':'sattın'+(tr.pl!=null?' ('+sgn(tr.pl*100)+fmt(tr.pl*100,1)+'%)':''))+(tr.src==='o'?', emirle':''),col:tr.side==='B'?'var(--up)':'var(--dn)'})});
ev.sort(function(x,y){return x.t-y.t});var cur=null;ev.forEach(function(e){if(e.t<=t)cur=e});
var mm=Math.floor(t*1.5/60),ss=Math.round(t*1.5%60);
if(t>=d.T){var pl=d.b[d.T];return {txt:'Oturum bitti: portföyün '+sgn(pl)+fmt(pl)+'%, endeks '+sgn(d.a[d.T])+fmt(d.a[d.T])+'%',col:'var(--ac)'}}
return cur?{txt:mm+':'+String(ss).padStart(2,'0')+' · '+cur.txt,col:cur.col}:{txt:mm+':'+String(ss).padStart(2,'0')+' · Oturum başladı',col:'var(--mu)'}}

h+='<line x1="'+FP.l+'" x2="'+(FW-FP.r)+'" y1="'+d.y0.toFixed(1)+'" y2="'+d.y0.toFixed(1)+'" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 4"/>';

return h}

function startFilm(){if(!$('fcr'))return;filmD=filmData();cancelAnimationFrame(filmRAF);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){S.filmP=1;filmFrame(1);return}
if(S.filmP==null)S.filmP=0;var dur=7000,t0=performance.now()-S.filmP*dur;
(function loop(now){var p=Math.min(1,(now-t0)/dur);
// Kolaylaştırma: başta ve sonda yavaşlar, ortada akar
S.filmP=p;var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;if(!filmFrame(e))return;if(p<1)filmRAF=requestAnimationFrame(loop)})(performance.now())}

if(S.post==null)return h+'<div class="note info"><span>Son bir adım: 3 soruluk son test. Sonra çalışmanın amacını anlatacağız.</span></div><button class="btn pri" data-a="testStart" data-v="post">Son testi çöz</button></div>';
// Manipülasyon kontrolü amacı açıklanmadan önce sorulmalı; yoksa cevap etkilenir
if(!S.manip)return h+sec('Son bir soru','<p style="margin:0 0 14px">Bu çalışma boyunca, zararına satış yapmak istediğinde ekrana bir <b>bekleme süresi</b> geldi mi?</p><div class="chips">'+['Evet','Hayır','Hatırlamıyorum'].map(function(o){return '<button class="chip" data-a="manip" data-v="'+o+'">'+o+'</button>'}).join('')+'</div>')+'</div>';

return h+sec('Çalışmanın amacı','<p style="margin:0 0 10px">Bu çalışmada, zararına satış yapmadan önce verilen <b>10 saniyelik bekleme süresinin</b> panik satışları azaltıp azaltmadığını inceledik.</p><p class="mu">Katılımcılar rastgele iki gruba ayrıldı. Bir grupta zararına satış yapmak istediğinde bekleme ekranı çıktı, diğerinde çıkmadı. Bunu baştan söylemedik, çünkü bilmek kararlarını etkileyebilirdi.</p><div class="note" style="margin:14px 0 0"><span><b>Sen '+(A?'bekleme süresi olan':'bekleme süresi olmayan (kontrol)')+' gruptaydın.</b></span></div>')+
sec('Bilmen gerekenler','<p class="mu" style="margin:0 0 8px">Piyasa, fiyatlar, haberler ve krizler tamamen simüleydi. Hisse kodları gerçek şirketlere ait olsa da fiyatlar gerçek değildi.</p><p class="mu" style="margin:0 0 8px">Uygulamadaki hiçbir şey yatırım tavsiyesi değildir.</p><p class="mu" style="margin:0">Soruların için: <b style="color:var(--tx)">'+esc(CFG.contact)+'</b></p>')+
sec('Verilerin','<p class="mu" style="margin:0 0 12px">Amacı öğrendikten sonra verilerinin çalışmada kullanılmasını istemiyorsan şimdi çekilebilirsin.</p><button class="btn ghost-dn" data-a="withdraw">Çalışmadan çekil, verilerimi sil</button>')+'</div>'}

function lineSvg(a,col){var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a),rg=(mx-mn)||1,H=100,pd=6,n=a.length,
pt=a.map(function(v,i){return [n>1?i/(n-1)*300:0,pd+(H-2*pd)*(1-(v-mn)/rg)]}),ln=pt.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' '),y0=Math.max(0,Math.min(H,pd+(H-2*pd)*(1-(10000-mn)/rg)));
return '<svg viewBox="0 0 300 '+H+'" width="100%" role="img" aria-label="Endeks grafiği"><line x1="0" x2="300" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="var(--ln)" stroke-dasharray="3 3"/><polygon points="0,'+H+' '+ln+' 300,'+H+'" fill="'+col+'" opacity=".12"/><polyline points="'+ln+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/></svg>'}
function ixCard(name,sub,list,h){var v=ixv(list),c=(v/10000-1)*100,col=c>=0?'var(--up)':'var(--dn)',
m=S.stocks.filter(function(x){return !list||list.indexOf(x.s)>=0}).map(function(x){return {s:x.s,c:dayCh(x)}}).sort(function(a,b){return b.c-a.c}),up=m[0],dn=m[m.length-1],mn=Math.min.apply(0,h),mx=Math.max.apply(0,h);
return '<div class="sec"><div class="sh"><h3>'+name+'</h3><span class="mu sm">'+sub+'</span></div><div class="sb"><div style="display:flex;align-items:baseline;gap:10px"><span style="font:750 30px/1.1 var(--fd);letter-spacing:-.8px" class="num">'+fmt(v)+'</span><span class="pill '+cls(c)+'">'+chg(c)+'</span></div><div style="margin-top:10px">'+lineSvg(h,col)+'</div><div class="kv"><span>Oturum aralığı</span><b>'+fmt(mn,0)+' – '+fmt(mx,0)+'</b></div><div class="kv"><span>En çok yükselen</span><b>'+up.s+' <span class="up">'+sgn(up.c)+fmt(up.c)+'%</span></b></div><div class="kv"><span>En çok düşen</span><b>'+dn.s+' <span class="dn">'+sgn(dn.c)+fmt(dn.c)+'%</span></b></div></div></div>'}
function ixHtml(){var rows=[['BIST 100',ixv()/100-100],['BIST 30',ixv(B30)/100-100],['Senin portföyün',plPct()]],mx=Math.max.apply(0,rows.map(function(r){return Math.abs(r[1])}).concat([1]));

los=Object.keys(S.pos).filter(function(k){return (price(k)-S.pos[k].avg)/S.pos[k].avg<=-0.05}).length,wy=T.filter(function(t){return t.why}).length,
row=function(k,val,d){return '<div style="padding:12px 0;border-top:1px solid var(--ln)"><div class="kv" style="padding:0"><span style="color:var(--tx);font-weight:600">'+k+'</span><b>'+val+'</b></div><div class="mu sm" style="margin-top:2px">'+d+'</div></div>'};

row('Zararına elle satış',ps.length+' / '+ms.length+' satış','%2 veya daha fazla zarardayken yaptığın satışlar')+
row('Elle yapılan işlem',man.length+' işlem','Bu oturumda kendin yaptığın alım ve satımlar ('+mmss(S.tick*1.5)+' içinde)')+
row('Zarardaki pozisyonlar',los+' hisse','Şu an %5 veya daha fazla zararda tuttuğun hisseler')+
row('Gerekçeli işlemler',wy+' / '+T.length,'Neden yaptığını işaretlediğin işlemler'));
if(S.crisisRes)h+='<div class="note info"><span>Son düşüş sırasında '+(S.crisisRes.sold?S.crisisRes.sold+' satış yaptın.':'satış yapmadın.')+'</span></div>';
h+='<div class="sec"><div class="sh"><h3>Detaylar</h3></div>'+ADS.map(function(d){return '<button class="row" data-a="ad" data-v="'+d[0]+'"><span class="rm"><span class="s">'+d[1]+'</span><span class="n">'+d[2]()+'</span></span><span class="chev"></span></button>'}).join('')+'</div>';

function crisisHtml(){if(S.crisis&&S.tick<=S.crisis.end)return '<div class="sb"><p class="mu" style="margin:0">Senaryo sürüyor. Portföy sekmesinde fiyatları izle.</p></div>';

function vAnalDetail(){var k=S.ad,t=ADS.filter(function(d){return d[0]===k})[0][1],h='<div style="display:flex;align-items:center;gap:10px;margin:4px 0 14px"><button class="icon" data-a="back" aria-label="Analize dön">‹</button><span style="font:700 22px/1.1 var(--fd)">'+t+'</span></div>';

function wrapC(){var m=M(),mt=S.trades.filter(function(t){return t.mood}),avg=mt.length?mt.reduce(function(a,t){return a+t.mood},0)/mt.length:0,ch=m.n>=3?m.ch:'Yeni başlayan',L=function(t){return '<div class="l">'+t+'</div>'};

// formu yavaş dolduran katılımcı piyasanın bir kısmını kaçırmaz.
setInterval(function(){
// Sekme gizliyken piyasa durur: bildirime bakmak için çıkan katılımcı piyasayı kaçırmasın
if(document.hidden)return;
// Alıştırma fiyatı Math.random ile oynar: gerçek piyasanın tohumlu akışını tüketmemeli
if(S.stage==='practice'&&S.pr){S.pr.p=Math.max(50,S.pr.p*(1+(Math.random()-0.5)*0.01));var e=$('prp');if(e)e.textContent='₺'+fmt(S.pr.p);return}
// Duygu sorusu açıkken piyasa durur: herkes soruyu farklı hızda yanıtlar ama aynı piyasayı görür
if(S.stage!=='app'||S.ended||S.tq||S.pulse)return;
stepMarket();chkOrd();S.series.pv[S.tick]=Math.round(total());live();if(S.sheet)updS();
if(S.pulseDue){var id=S.pulseDue;S.pulseDue=null;showPulse(id)}
if(S.tick%5===0)flush();if(S.tick%10===0)saveSnap();
if(S.tick>=CFG.ticks)endSession()},1500);

// Sayfa gizlenince/kapanınca durumu kaydet; görünürlük değişimi veri kalitesi için kaydedilir
document.addEventListener('visibilitychange',function(){if(document.hidden)S.lastHiddenAt=Date.now();if(!S.code)return;log(document.hidden?'hidden':'visible',{});if(document.hidden){saveSnap();flush()}});
addEventListener('pagehide',function(){if(S.code){saveSnap();flush()}});
setInterval(function(){if(S.code&&EVQ.length)flush()},15000);  // Bağlantı kopmuşsa kuyruğu düzenli dene

// ───────────────── Modal ─────────────────
function openModal(h){$('mbox').innerHTML=h;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open');$('mbox').innerHTML=''}
// Tarayıcının confirm() kutusu çerçeve içinde engellenebildiği için kendi onay penceremiz
function askConfirm(title,text,okLabel,danger,fn){S._ok=fn;openModal('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><button class="btn '+(danger?'danger':'pri')+'" data-a="mOk">'+esc(okLabel)+'</button><button class="btn" data-a="mCancel">Vazgeç</button>')}
function showPulse(id){S.pulse={id:id,t0:Date.now()};log('stress_prompt',{crisis:id});
openModal('<h2>Az önce piyasada sert bir düşüş oldu</h2><p>Şu an ne kadar gergin hissediyorsun?</p><div class="scale">'+[1,2,3,4,5].map(function(n){return '<button data-a="pulse" data-v="'+n+'">'+n+'</button>'}).join('')+'</div><div class="scale-l"><span>Hiç gergin değilim</span><span>Çok gerginim</span></div><button class="link" style="width:100%;margin-top:12px" data-a="pulse" data-v="0">Cevaplamak istemiyorum</button>')}
async function doWithdraw(){var c=S.code,g=S.grp;remember(null);S.allocCache=null;try{await Store.withdraw(c,g)}catch(e){note('Çekilme kaydedilemedi, bağlantını kontrol edip tekrar dene.');return}
try{localStorage.removeItem('ilklot:q:'+c)}catch(e){}EVQ=[];S.code=null;S.ended=true;closeS();S.stage='withdrawn';render()}

var storeReady=Store.init();
render();boot();
</script>
</body>
</html>
