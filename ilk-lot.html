/* Üniversite paleti: soğuk gri zemin, çivit mavisi eylem.
   Anlam ayrımı korunur: --pr = eylem (çivit), --wr/--wt = uyarı (amber), --up/--dn = fiyat yönü (yeşil/kırmızı).
   Çivit, yeşil ve kırmızıyla karışmadığı için hiçbir seçenek "doğru" ya da "tehlikeli" gibi kodlanmaz. */
:root{
  --bg:#F4F4F4;--sf:#FFFFFF;--sf2:#EAEAEA;--ln:#D8D8D8;
  --tx:#111111;--mu:#595959;--mu2:#5C5C5C;
  --ac:#111827;--acs:rgba(17,24,39,.10);--act:#000000;--ink:#FFFFFF;
  --pr:#111827;--onpr:#FFFFFF;--fl:#111827;
  --cfx:inset 0 0 34px 2px rgba(194,65,45,.30),inset 0 0 0 2px rgba(194,65,45,.55);--pend:#C98A1B;
  --up:#1B7B54;--ups:rgba(27,123,84,.1);--dn:#C2412D;--dns:rgba(194,65,45,.09);
  --wr:#FCEFD6;--wt:#7A4B00;
  --shadow:0 -14px 44px rgba(0,0,0,.16);
  --fd:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Koyu tema: tema düğmesiyle (ya da görüntüleyici data-theme="dark" verirse). Aynı anlam ayrımı korunur */
:root[data-theme="dark"]{
  --bg:#0B0B0C;--sf:#141416;--sf2:#1D1D20;--ln:#2E2E33;
  --tx:#F0F0F2;--mu:#A5A5AD;--mu2:#92929A;
  --ac:#F2A93B;--acs:rgba(242,169,59,.14);--act:#F6C979;--ink:#1A1200;
  --pr:#F2A93B;--onpr:#1A1200;--fl:#F2A93B;
  --cfx:inset 0 0 70px 12px rgba(255,70,55,.5),inset 0 0 0 2px rgba(255,90,70,.5);--pend:#F2A93B;
  --up:#3FD08F;--ups:rgba(63,208,143,.13);--dn:#FF6B5B;--dns:rgba(255,107,91,.13);
  --wr:rgba(242,169,59,.13);--wt:#F6C979;
  --shadow:0 -14px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer}
.brand b{font:700 20px/1 var(--fd);letter-spacing:-.4px;white-space:nowrap}
.hr{display:flex;align-items:center;gap:8px}
.score{white-space:nowrap;font-size:12px;font-weight:700;color:var(--act);background:var(--acs);padding:6px 11px;border-radius:999px}
.icon{width:36px;height:36px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);display:grid;place-items:center;padding:0;cursor:pointer;font-size:18px;line-height:1;flex:none}
main{flex:1;overflow-y:auto;padding:2px 16px 28px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;gap:2px;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px 8px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu2);font-size:11px;font-weight:600;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}
nav button{position:relative}nav button.nw::after{content:'';position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--tx);border:2px solid var(--sf)}

#toast{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
/* Hisse ekranı açıkken bildirim üste çıkar, Al/Sat ve Vazgeç düğmelerini kapatmasın */
#toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}

/* Portföy değeri sayfanın tek "büyük" öğesi: dikkat önce buraya gitsin */
.hero{padding:10px 2px 18px}
.hero .lbl{color:var(--mu);font-size:13px}
.hero .val{font:750 46px/1.02 var(--fd);letter-spacing:-1.8px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--ups);color:var(--up)}.pill.dn{background:var(--dns);color:var(--dn)}
.hsub{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mu)}
.hsub b{display:block;color:var(--tx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

.seg{display:flex;gap:4px;background:var(--sf2);border-radius:14px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:600;font-size:13.5px;padding:10px 6px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.seg.sm button{font-size:12px;padding:8px 4px}

.sec{background:var(--sf);border:1px solid var(--ln);border-radius:20px;margin-bottom:14px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 16px 6px}
.sh h3{margin:0;font:700 17px/1.2 var(--fd);letter-spacing:-.2px}
.sb{padding:6px 16px 16px}
.sb p{margin:6px 0 0}

.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;border-top:1px solid var(--ln);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.sh+.row,.sh+.list .row:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font:700 12px var(--fd);color:var(--mu);flex:none;letter-spacing:.2px}
.rm{flex:1;min-width:0;display:block}
.rm .s{display:block;font-weight:700}
.rm .n{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:block;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rr .rp{display:block;font-weight:600}
.rr .rc{display:block;font-size:12.5px;font-weight:600}
.rs{flex:none;display:block;line-height:0}
.chev{width:8px;height:8px;border-right:2px solid var(--mu2);border-top:2px solid var(--mu2);transform:rotate(45deg);flex:none;margin-right:4px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.t-up{background:var(--ups);color:var(--up)}.t-dn{background:var(--dns);color:var(--dn)}.t-h{background:var(--wr);color:var(--wt)}

.btn{display:block;width:100%;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);border-radius:14px;padding:15px 16px;font-weight:700;font-size:15px;cursor:pointer;text-align:center}
.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--onpr)}
.btn.danger{background:var(--dn);border-color:var(--dn);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn+.btn{margin-top:10px}
.link{background:none;border:0;color:var(--mu);font-weight:600;padding:10px;cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:var(--sf2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--act)}

.note{display:flex;gap:10px;background:var(--wr);color:var(--wt);border-radius:16px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.note b{color:inherit}
.note.info{background:var(--sf2);color:var(--mu)}
.foot{text-align:center;color:var(--mu2);font-size:12px;margin:10px 0 0}

.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .4s}
.met{margin-top:14px}
.met .mh{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* b19 serbest mod */
.flim{margin:0 0 14px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;font-size:13px}
.flim .kv{flex-wrap:wrap;gap:2px 10px}
.fbar{height:8px;border-radius:99px;background:var(--sf2);margin:8px 0 6px;overflow:hidden}
.fbar i{display:block;height:100%;border-radius:99px;background:var(--mu);transition:width .4s}
.fbar i.hot{background:var(--dn)}
.flvs{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.flv{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;min-height:44px;padding:13px 15px;border:1.5px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);cursor:pointer}
.flv b{font:700 17px var(--fd)}
.flv span{font-weight:650;font-size:13px}
.flv small{color:var(--mu);font-size:12.5px;line-height:1.4}
.flv.on{border-color:var(--ac);background:var(--sf2);box-shadow:0 0 0 1px var(--ac) inset}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat span{display:block;color:var(--mu);font-size:12px}
.stat b{display:block;font:700 20px/1.2 var(--fd);margin-top:2px;font-variant-numeric:tabular-nums}
.field{width:100%;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:0 14px;font:inherit}
.field::placeholder{color:var(--mu2)}

/* Alt pencere (hisse ekranı) */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(3,6,14,.58);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:94%;overflow-y:auto;background:var(--sf);border-top:1px solid var(--ln);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
#sheet.open{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 12px}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shh .t{font:700 20px/1.1 var(--fd)}
.sp{font:750 36px/1.05 var(--fd);letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin-top:12px}
.lab{display:block;color:var(--mu);font-size:13px;margin:14px 0 6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper>button{width:48px;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);font-size:22px;cursor:pointer;flex:none}
.stepper input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);text-align:center;font:700 20px var(--fd)}
.stepper .btn.sm{height:48px}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--mu)}
.kv b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.kv b.up,.stat b.up{color:var(--up)}.kv b.dn,.stat b.dn{color:var(--dn)}
.kvs{margin:12px 0}
details.more{border-top:1px solid var(--ln);margin-top:14px}
details.more+details.more{margin-top:0}
details.more summary{list-style:none;cursor:pointer;padding:15px 2px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more>div{padding:0 2px 14px}
.q{font-weight:700;margin:18px 0 10px}
.big-sum{font:700 24px/1.2 var(--fd);letter-spacing:-.4px;margin:14px 0 4px}
.count{font:800 64px/1 var(--fd);text-align:center;margin:18px 0;font-variant-numeric:tabular-nums}

/* Karşılama, test ve tanıtım ekranları */
.stage{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:18px 4px 8px}
.stage h1{font:750 32px/1.08 var(--fd);letter-spacing:-.9px;margin:20px 0 12px}
.stage p{color:var(--mu);margin:0 0 12px}
.stage .act{margin-top:18px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--ln);transition:width .2s}
.dots i.on{width:24px;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer}
.opt.ok{border-color:var(--up);background:var(--ups)}
.opt.no{border-color:var(--dn);background:var(--dns)}
.giant{font:800 52px/1 var(--fd);letter-spacing:-2px;color:var(--ac);font-variant-numeric:tabular-nums}

.wrapc{background:linear-gradient(160deg,#1C2A4A,#101827);color:#F1EEE6;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #2A3A60}
.wrapc .k{font:800 34px/1.05 var(--fd);color:#F2A93B;margin:8px 0 6px;letter-spacing:-.8px}
.wrapc .l{margin-top:7px;font-size:14px;color:#D8DCE6}
.gauge-t{text-align:center;color:var(--mu);font-size:13.5px;margin:4px 0 0}
pre.json{font-size:11px;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;color:var(--mu);background:var(--bg);border-radius:12px;padding:10px}
/* Modal: kriz sonrası soru ve onay pencereleri. Hisse ekranının da üstünde durur */
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.66)}
#modal.open{display:flex}
#modal .box{width:100%;max-width:400px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h2{font:750 24px/1.15 var(--fd);letter-spacing:-.5px;margin:0 0 8px}
#modal p{color:var(--mu);margin:0 0 14px}
.scale{display:flex;gap:6px}.scale button{flex:1;height:52px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);font:700 18px var(--fd);cursor:pointer}
.scale-l{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin:6px 2px 0}
.btn.ghost-dn{background:none;border-color:var(--dn);color:var(--dn)}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.steps i.on{background:var(--ac)}
/* Kayıt durumu noktası: yeşil = kaydedildi, sarı = gönderiliyor, kırmızı = bağlantı yok */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--up)}
.dot.pend{background:var(--pend)}.dot.err{background:var(--dn);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.q2{font-weight:700;margin:20px 0 8px}
/* ── Yön ışığı: ekran kenarlarından içeri yayılan yumuşak ışık. Tıklamayı engellemez ──
   Yükselişte yeşil, düşüşte kırmızı. Sert düşüşte biraz daha belirgin. Yavaşça "nefes alır".
   Işık rengi --glow değişkeninden gelir; ::after onu #app'ten devralır. */
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:0;transition:opacity .9s ease;box-shadow:var(--glow,none)}
#app.gl-up{--glow:inset 0 0 70px -10px rgba(30,138,94,.30),inset 0 0 22px -12px rgba(30,138,94,.35)}
#app.gl-dn{--glow:inset 0 0 70px -10px rgba(194,65,45,.28),inset 0 0 22px -12px rgba(194,65,45,.32)}
#app.gl-dn.gl-strong{--glow:inset 0 0 90px -8px rgba(194,65,45,.38),inset 0 0 26px -10px rgba(194,65,45,.40)}
:root[data-theme="dark"] #app.gl-up{--glow:inset 0 0 80px -10px rgba(63,208,143,.30)}
:root[data-theme="dark"] #app.gl-dn{--glow:inset 0 0 80px -10px rgba(255,107,91,.28)}
:root[data-theme="dark"] #app.gl-dn.gl-strong{--glow:inset 0 0 100px -8px rgba(255,107,91,.38)}
#app.gl-up::after,#app.gl-dn::after{opacity:1;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#app.gl-up::after,#app.gl-dn::after{animation:none;opacity:.8}}
/* Ekranda görünmeyen ama ekran okuyucunun okuduğu metin */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Yön rozeti: ▲ yeşil zeminli, ▼ kırmızı zeminli */
.dir{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;margin-top:4px}
.dir.up{background:var(--ups);color:var(--up)}.dir.dn{background:var(--dns);color:var(--dn)}
.giant .ar{display:inline-block;transform-origin:center bottom;animation:arPop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes arPop{0%{transform:scale(.4) translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.giant .ar{animation:none}}
/* Düşen fiyat anlık kırmızı parlar ve hafifçe titrer */
.fl{animation:fl .6s ease-out}
@keyframes fl{0%{color:#fff;background:rgba(255,80,60,.55);transform:translateX(-2px)}25%{transform:translateX(2px)}50%{transform:translateX(-1px)}100%{background:transparent;transform:none}}
.rp{border-radius:6px;padding:0 3px;margin-right:-3px}
/* ── Kararlarının filmi ── */
.film{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px 12px 12px;margin:6px 0 14px;color:var(--tx)}
:root[data-theme="dark"] .film{background:linear-gradient(180deg,#141416,#0F0F11)}
.film .ft{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.film .ft b{font:700 17px var(--fd)}
.film .cap{min-height:40px;padding:8px 6px 0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.film .cap i{width:8px;height:8px;border-radius:50%;flex:none}
.film .lg{display:flex;gap:14px;font-size:11.5px;color:var(--mu);padding:6px 4px 0;flex-wrap:wrap}
.film .lg span{display:inline-flex;align-items:center;gap:5px}
.mk{transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
.mk.off{opacity:0;transform:scale(.2)}
@media (prefers-reduced-motion:reduce){#app.crisis::after{animation:none;opacity:.7}.fl{animation:none}.mk{transition:none}}
/* ── Araştırmacı panosu ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.kpi{background:var(--sf2);border-radius:16px;padding:12px 14px}
.kpi span{display:block;color:var(--mu);font-size:12px}
.kpi b{display:block;font:750 28px/1.1 var(--fd);letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;color:var(--mu);font-size:12px;font-weight:600}
.flag{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.flag:first-child{border-top:0}
.flag code{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
/* Hata kutusu: ".stage p" gri rengini ezmesi için daha belirgin seçici. Her basışta sallanır ki tepki görülsün */
.stage .err,.err{display:flex;gap:10px;align-items:flex-start;color:var(--dn);background:var(--dns);border:1px solid color-mix(in srgb,var(--dn) 45%,transparent);border-radius:14px;padding:11px 13px;margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.4}
.err::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--dn);color:var(--ink);font:800 13px/20px var(--fb);text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* ── Karar seçenekleri: üçü de aynı görünümde, hiçbiri öne çıkarılmaz ── */
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:16px;padding:16px 18px;cursor:pointer;color:var(--tx);transition:border-color .15s,transform .1s}
.choice b{font:700 19px var(--fd)}.choice span{color:var(--mu);font-size:13px;text-align:right}
.choice:hover{border-color:var(--mu2)}.choice:disabled{opacity:.45;cursor:not-allowed}.choice:active{transform:scale(.99)}
.steps i{height:5px}
/* ── Rehberli tur: alttaki kart + vurgulanan öğe. Tur sürerken seçimler kilitli ── */
#tour{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:46;background:var(--tx);color:var(--bg);border-radius:20px;padding:16px 16px 12px;box-shadow:0 18px 50px rgba(20,18,43,.35)}
/* Vurgulanan öğe alttaysa (alt menü) kart üste geçer */
#tour.top{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
#tour .tt{font-size:12px;font-weight:700;opacity:.7;margin-bottom:4px}
#tour p{margin:0 0 12px;font-size:15px;line-height:1.45}
#tour .tb{display:flex;justify-content:space-between;align-items:center}

// Uyaranlar (grafikler, haberler, sonuçlar) bu tohumdan üretilir: herkes aynı 16 anı aynı sırayla görür.
function seedOf(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}

function rnd(){_rs=(_rs+0x6D2B79F5)>>>0;var t=_rs;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function rr(a,b){return a+rnd()*(b-a)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function r2(v){return Math.round(v*100)/100}
function sgn(v){return r2(v)>=0?'+':''}

function chg(v){var r=r2(v);return (r>0?'▲ ':r<0?'▼ ':'')+fmt(Math.abs(v))+'%'}

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

// ═════════════════ KOD VE RANDOMİZASYON ═════════════════
// Kod: 12 karakter, KM7D-P2XR-9TQA biçiminde. Karıştırılan karakterler (0/O, 1/I) alfabede yok.
// 32^12 ≈ 10^18 olasılık: tahmin etmek pratikte imkânsız. Sıra numarası koda gömülü değil, sadece araştırmacıda.
var ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',CODE_RE=/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
function cryptoInt(n){var a=new Uint32Array(1);(window.crypto||window.msCrypto).getRandomValues(a);return a[0]%n}
function newCode(){var c='';for(var i=0;i<12;i++){c+=ALPHA[cryptoInt(32)];if(i===3||i===7)c+='-'}return c}
// Boşluk, tire, küçük harf fark etmez; 12 karakter değilse geçersiz
function normCode(raw){var s=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return s.length===12?s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8):null}
// Yazarken 4'erli gruplara ayırır: "km7dp2" → "KM7D-P2"
function fmtCodeInput(raw){return String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12).replace(/(.{4})(?=.)/g,'$1-')}
// Blok randomizasyon: her 4 kişilik blokta 2 A + 2 B, sırası gizli rastgele. Grup sayıları hiçbir zaman 2'den fazla açılmaz
function makeAlloc(n,block,start){var map={},i=0;start=start||0;
while(i<n){var b=[];for(var k=0;k<block;k++)b.push([k<block/2?'A':'B',k%2]);
for(k=b.length-1;k>0;k--){var j=cryptoInt(k+1),t=b[k];b[k]=b[j];b[j]=t}
for(k=0;k<b.length&&i<n;k++,i++){var c;do{c=newCode()}while(map[c]);map[c]={grp:b[k][0],order:b[k][1],no:start+i+1,block:Math.floor((start+i)/block)+1}}}
return map}
function linkFor(code){var base=(S.baseIn||CFG.baseUrl||(location.origin+location.pathname)).split('#')[0];return base+'#k='+code}
function remember(code){if(DEMO)return;try{code?localStorage.setItem('ilklot:me',code):localStorage.removeItem('ilklot:me')}catch(e){}}
function remembered(){if(DEMO)return null;try{return localStorage.getItem('ilklot:me')}catch(e){return null}}
function maskCode(c){return '••••-••••-'+String(c).slice(-4)}

var N=CFG.simTicks,tr=keep.trades.map(function(r,i){return [r,i]}).sort(function(a,b){return a[0].t-b[0].t||a[1]-b[1]}).map(function(x){return x[0]});
simInit();var m=S.sim,pos={},v=[],ti=0,cash=m.cash;SIMBASE.forEach(function(b){pos[b[0]]=m.pos[b[0]].q});
function ap(t){while(ti<tr.length&&tr[ti].t<=t){var r=tr[ti++],p=m.p[r.sym];if(r.side==='S'){cash+=r.q*p;pos[r.sym]-=r.q}else{cash=Math.max(0,cash-r.q*p);pos[r.sym]+=r.q}}}
function val(){var x=cash;for(var k in pos)x+=pos[k]*m.p[k];return x}
ap(0);v.push(val());for(var t=1;t<=N;t++){simStep();ap(t);v.push(val())}

s+='<text x="8" y="'+(H-6)+'" font-size="11" fill="var(--mu)">Gün 0</text><text x="'+(W-8)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--mu)">Gün '+N+'</text><text x="'+(W-8)+'" y="'+(g.Y(d.v0)-4).toFixed(1)+'" font-size="11" text-anchor="end" fill="var(--mu)">başlangıç</text></svg>';

 x.strokeStyle=v('--mu');x.lineWidth=2;x.setLineDash([10,10]);x.beginPath();x.moveTo(cx0,Y(d.v0));x.lineTo(cx0+cw,Y(d.v0));x.stroke();x.setLineDash([]);

 d.tr.forEach(function(k){var px=X(k.t),py=Y(d.v[k.t]);x.beginPath();x.arc(px,py,10,0,6.2832);if(k.side==='S'){x.fillStyle=v('--tx');x.fill();x.strokeStyle=v('--sf');x.lineWidth=3;x.stroke()}else{x.fillStyle=v('--sf');x.fill();x.strokeStyle=v('--tx');x.lineWidth=4;x.stroke()}});

// ═════════════════ GENEL İLERLEME ═════════════════
// 5 adım: Hazırlık → 1. bölüm → 2. bölüm (simülatör) → 3. bölüm → Bitiş. Geçerli adım, kendi içindeki ilerlemeyle kısmen dolar
var GP_LABELS=['Hazırlık','1. bölüm','2. bölüm','3. bölüm','Bitiş'],GP_W=[0.18,0.19,0.28,0.19,0.16];
function gpState(){if(DEMO||S.free)return null;var st=S.stage,N=TRS.X.length;
if(S.tq&&S.tq.kind==='post')return [4,0.1];
if(st==='demo')return [0,0.12];if(st==='pre')return [0,0.3];if(st==='intro')return [0,0.45+0.1*S.intro];
if(st==='task'&&S.tr){if(S.tr.mode==='practice')return S.tr.phase==='quiz'?[0,0.88]:S.tr.phase==='ready'?[0,0.97]:[0,0.65+0.1*S.tr.i];
 return [S.block==='post'?3:1,Math.min(1,S.ti/N)]}
if(st==='stress')return S.stressKey==='b_post'?[3,1]:S.stressKey==='b_sim'?[2,1]:[1,1];
if(st==='bridge')return S.bridge==='post'?[3,0]:[2,0];
if(st==='sim'&&S.sim)return S.prac?[2,0]:[2,Math.min(1,S.sim.tick/CFG.simTicks)];
if(st==='end')return [4,S.post==null?0.15:!S.manip?0.45:S.guess==null?0.7:0.9];
return null}
function progress(){var el=$('gp'),g=gpState();if(!g){el.hidden=true;return}
var pct=0,i;for(i=0;i<g[0];i++)pct+=GP_W[i];pct=Math.round((pct+GP_W[g[0]]*g[1])*100);
var h=GP_LABELS.map(function(l,k){var fill=k<g[0]?100:k===g[0]?Math.round(g[1]*100):0;return '<div><div class="gb"><i style="width:'+fill+'%"></i></div><div class="gl'+(k===g[0]?' cur':k<g[0]?' done':'')+'">'+l+'</div></div>'}).join('');
if(el._h!==h){el.innerHTML='<div class="gs">'+h+'</div>';el._h=h}
el.setAttribute('aria-valuenow',pct);el.setAttribute('aria-valuetext',GP_LABELS[g[0]]+', toplam %'+pct);el.hidden=false}

// pre: 1. bölüm (6 karar) → sim: 2. bölüm (simülatör) → post: 3. bölüm (6 karar) → done
function taskAt(){S.stage='task';S.tr={mode:'main',i:S.ti,phase:'choose',t0:Date.now(),first:null}}
function resumeFlow(){
if(S.ended||S.phase==='done'){S.stage='end';return}
if(S.phase==='pre'){S.block='pre';if(S.ti<BT().length)return taskAt();if(!S.pulses.b_pre){S.stage='stress';S.stressKey='b_pre';return}S.stage='bridge';S.bridge='sim';return}
if(S.phase==='sim'){if(!S.sim)simInit();if(S.sim.tick>=CFG.simTicks){S.stage='stress';S.stressKey='b_sim';return}S.stage='sim';return}
if(S.phase==='post'){S.block='post';if(S.ti<BT().length)return taskAt();if(!S.pulses.b_post){S.stage='stress';S.stressKey='b_post';return}S.stage='end';setTimeout(endSession,0)}}
function startTrial(){S.tr.phase='choose';S.tr.t0=Date.now();S.tr.first=null;S.tr.firstMs=null;S.tr.cdShown=false;S.tr.cdWait=null;
if(S.tr.mode==='main')log('trial_show',{id:BT()[S.ti].id,block:S.block,n:S.ti+1});render()}

// Görevlerde bekleme süresi YOK (iki grupta da): 1. ve 3. bölüm aktarımı ölçer
function choose(c){var tr=S.tr,now=Date.now();if(tr.first==null){tr.first=c;tr.firstMs=now-tr.t0}finalize(c)}
function finalize(c){var tr=S.tr,t=curTrial(),now=Date.now(),
// Sonuç: sat = fiyat değişiminden etkilenmez; tut = pozisyon × değişim; daha al = (pozisyon + ek) × değişim
res=c==='sat'?0:c==='tut'?CFG.stake*t.out:(CFG.stake+CFG.addAmount)*t.out;
var d={id:t.id,block:S.block,set:t.set,n:t.n,sym:t.sym,kind:t.kind,pos:t.pos,pl:t.pl,crowd:t.crowd,news:!!t.news,out:t.out,first:tr.first,final:c,
rtFirst:tr.firstMs,rtFinal:now-tr.t0,hid:(S.lastHiddenAt||0)>tr.t0,res:Math.round(res)};
tr.last=d;tr.phase='outcome';
if(tr.mode==='main'){S.dec.push(d);S.total+=d.res;S.ti++;log('decision',d);saveSnap();flush()}
else log('practice_trial',{id:t.id,final:c,rtFirst:tr.firstMs});
render()}
function nextAfterOutcome(){var tr=S.tr;
if(tr.mode==='practice'){if(tr.i+1<PR.length){tr.i++;startTrial()}else{S.comp=S.comp||{i:0,sel:null,first:[],att:[],f:compNew()};tr.phase='quiz';log('practice_done',{});saveSnap();render()}return}
if(S.ti>=BT().length){S.stage='stress';S.stressKey=S.block==='pre'?'b_pre':'b_post';S.stressT0=Date.now();render();return}
tr.i=S.ti;startTrial()}

if(S.stage==='task'&&S.tr&&S.tr.mode==='practice'&&S.tr.phase==='choose'){st=TOUR_TASK.filter(function(x){return $(x[0])&&!S.tourSeen[x[0]]});if(st.length)startTour(st,'task')}
else if(S.stage==='sim'&&!S.free&&!S.tourSeen.sim){st=TOUR_SIM.filter(function(x){return $(x[0])});if(st.length)startTour(st,'sim')}}
function startTour(steps,key){S.tour={steps:steps,i:0,key:key,t0:Date.now()};log('tour_start',{key:key,n:steps.length})}
function applyTour(){var el=$('tour'),app=$('app');document.querySelectorAll('.hl').forEach(function(x){x.classList.remove('hl')});
if(!S.tour){el.hidden=true;el.innerHTML='';app.classList.remove('touring');return}
var t=S.tour,s=t.steps[t.i],tg=$(s[0]),last=t.i+1>=t.steps.length;app.classList.add('touring');el.classList.toggle('top',s[0]==='nav');
el.innerHTML='<div class="tt">'+(t.i+1)+' / '+t.steps.length+'</div><p>'+s[1]+'</p><div class="tb"><button class="ts" data-a="tourSkip">'+(last?'':'Turu geç')+'</button><button class="tn" data-a="tourNext">'+(last?'Anladım':'İleri')+'</button></div>';el.hidden=false;
if(tg){tg.classList.add('hl');var vw=$('view').getBoundingClientRect(),r=tg.getBoundingClientRect(),cardTop=el.getBoundingClientRect().top;
if(s[0]!=='nav'&&(r.top<vw.top||r.bottom>cardTop-12)){try{tg.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}catch(e){}}}}
function endTour(skipped){var t=S.tour;if(!t)return;t.steps.forEach(function(x){S.tourSeen[x[0]]=1});if(t.key==='sim')S.tourSeen.sim=1;
log('tour_done',{key:t.key,skipped:!!skipped,atStep:t.i+1,ms:Date.now()-t.t0});S.tour=null;applyTour();saveSnap()}

function modalOpen(){return $('modal').classList.contains('open')}
// Piyasa döngüsü: sadece simülatör ekranında, sekme görünürken ve işlem penceresi kapalıyken ilerler
function marketTick(){if(S.stage!=='sim'||!S.sim||document.hidden||modalOpen()||S.tour||S.sim.tick>=simLim())return;
simStep();simLive();header();var m=S.sim,c=simCrisis(m.tick);
if(c&&m.tick===c.at){log('sim_crisis_start',{stocks:c.stocks,tab:S.simTab});if(S.simTab!=='p')note('Sert düşüş: '+c.stocks.join(', ')+'. Portföyüne bak.');if(navigator.vibrate)try{navigator.vibrate([80,60,80])}catch(e){}}
if(S.free){freeOrders();var fv=simValue();if(fv>S.free.peak)S.free.peak=fv;if(fv<=freeLimitF(S.free,m.v0)){freeFinish('limit');return}}
if(m.tick%10===0){saveSnap();flush()}
if(m.tick>=simLim()){if(S.prac)pracEnd(false);else simEnd()}}
// Tanıtım modunda hız çarpanı (1, 2, 4): aynı turu art arda çalıştırır; gerçek akışta çarpan hep 1
// b23: serbest modda hız (0 duraklat, 1, 2, 4) oyuncunun kendi seçimidir; tanıtım hızı yalnızca serbest dışında geçerli
setInterval(function(){var n=S.free?(S.free.speed==null?1:S.free.speed):DEMO?(S.demoSpeed||1):1;for(var i=0;i<n;i++)marketTick()},CFG.simTickMs);
// b23: serbest mod otomatik sat emirleri. Eşik, hissenin ORTALAMA ALIŞ fiyatına göre kâr/zarardır; tetiklenince hissenin tamamı O ANKİ fiyattan satılır
// (sert düşüşte eşiğin altından satış olabilir). Hissenin tamamı satıldığı için doSimSell emri siler: emir bir kez çalışır.
function freeOrders(){var m=S.sim;if(!S.free||!m||!m.orders)return;
 SIMBASE.forEach(function(b){var k=b[0],od=m.orders[k],o=m.pos[k];if(!od||!o||o.q<1)return;var pl=m.p[k]/o.avg-1,t=null;
  if(od.stop!=null&&pl<=-od.stop)t='stop';else if(od.take!=null&&pl>=od.take)t='take';
  if(!t)return;var q=o.q,p=m.p[k];doSimSell(k,q,false);var tr=m.trades[m.trades.length-1];if(tr)tr.auto=t;
  note('Otomatik emir: '+k+(t==='stop'?' zarar eşiği (−%'+Math.round(od.stop*100)+')':' kâr eşiği (+%'+Math.round(od.take*100)+')')+' aşıldı, '+q+' lot ₺'+fmt(p)+' fiyattan satıldı.')})}
function tabTick(){if(S.stage!=='sim'||!S.tabSince)return;var now=Date.now();S.tabT[S.simTab]=(S.tabT[S.simTab]||0)+(now-S.tabSince);S.tabSince=now}
function pracEnd(skipped){var p=S.prac;if(!p)return;tabTick();S.tabSince=null;closeModal();clearInterval(S.cdt);var n=S.sim?S.sim.trades.length:0,tk=S.sim?S.sim.tick:0;
S.prac=null;S.sim=null;S.simDetail=null;S.simTrade=null;S.simWhy=null;S.simCd=null;S.tour=null;applyTour();
log('practice_sim',{trades:n,tick:tk,skipped:!!skipped,ms:Date.now()-p.t0});flush();S.stage='bridge';S.bridge='simready';render()}
function freeFinish(kind){var f=S.free,m=S.sim;if(!f||!m||f.res)return;closeModal();clearInterval(S.cdt);S.simTrade=null;S.simWhy=null;S.simCd=null;
 f.res={kind:kind,tick:m.tick,value:simValue(),v0:m.v0,peak:f.peak,trades:m.trades.length};S.stage='freeend';render();window.scrollTo(0,0)}
function simEnd(){tabTick();S.tabSince=null;closeModal();clearInterval(S.cdt);var m=S.sim;if(DEMO){S.stage='demoend';render();return}log('sim_end',{value:Math.round(simValue()),trades:m.trades.length});S.stage='stress';S.stressKey='b_sim';S.stressT0=Date.now();saveSnap();flush();render()}
function simRec(k,side,q,p,extra){var m=S.sim,o=m.pos[k],r={t:m.tick,sym:k,side:side,q:q,p:r2(p),pl:o?Math.round((p/o.avg-1)*10000)/10000:null,
// Bu hisse şu an krizde mi; ya da krizinden sonraki 20 gün içinde mi (dipteki satışlar buraya düşer)
crisis:!!simStockCrisis(k,m.tick,0),postCrisis:!!simStockCrisis(k,m.tick,20),decMs:S.simTrade?Date.now()-S.simTrade.t0:null};for(var x in extra)r[x]=extra[x];return r}
function doSimSell(k,q,afterCd){var m=S.sim,o=m.pos[k],p=m.p[k];if(!o||q<1||q>o.q)return;var t=S.simTrade||{},
r=simRec(k,'S',q,p,{frac:Math.round(q/o.q*1000)/1000,afterCooldown:!!afterCd,value:Math.round(q*p),why:S.simWhy?S.simWhy.why:null,qMode:t.mode||null,qEdits:t.edits||0});S.simWhy=null;
m.cash+=q*p;o.q-=q;if(S.free&&o.q<1&&m.orders)delete m.orders[k];m.trades.push(r);log('sim_trade',r);S.simTrade=null;closeModal();saveSnap();if(S.simDetail)render();else simLive();note(k+': '+q+' lot satıldı (₺'+fmt(q*p,0)+').')}
function doSimBuy(k,q){var m=S.sim,p=m.p[k],o=m.pos[k],c=q*p;if(!(q>=1)||c>m.cash+1e-9)return;var t=S.simTrade||{},r=simRec(k,'B',q,p,{value:Math.round(c),qMode:t.mode||null,qEdits:t.edits||0});
o.avg=o.q>0?(o.avg*o.q+p*q)/(o.q+q):p;o.q+=q;m.cash=Math.max(0,m.cash-c);m.trades.push(r);log('sim_trade',r);S.simTrade=null;closeModal();saveSnap();if(S.simDetail)render();else simLive();note(k+': '+q+' lot alındı (₺'+fmt(c,0)+').')}

document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.in;if(!k)return;var v=e.target.value;
if(k==='code'){S.codeErr='';if(e.isComposing){S.codeIn=v;return}var f=fmtCodeInput(v);if(f!==v)e.target.value=f;S.codeIn=f}
else if(k==='simq'){var dg=v.replace(/\D/g,'').slice(0,6);if(dg!==v)e.target.value=dg;if(S.simTrade){S.simTrade.q=dg===''?0:parseInt(dg,10);S.simTrade.mode='typed';S.simTrade.edits++;updTrade()}}
else if(k==='consentOk'){S.consentChk=e.target.checked;var cb=$('cbtn');if(cb)cb.disabled=!S.consentChk||!!S.busy}
else if(k==='dashAuto'){S.dashAuto=e.target.checked}else if(k==='baseIn'){S.baseIn=v}else if(k==='landIn'){S.landIn=v}else if(k==='posterMail'){S.posterMail=v}else if(k==='posterFoot'){S.posterFoot=v}});
// Onam ayrıntılarından hangileri açıldı (okuma göstergesi). 'toggle' kabarcıklanmaz: yakalama aşamasında dinlenir
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.dataset&&d.dataset.cs){S.consentOpen=S.consentOpen||{};S.consentOpen[d.dataset.cs]=1}},true);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='ci')enterCode(e.target.value)});
document.addEventListener('compositionend',function(e){if(e.target&&e.target.id==='ci'){var f=fmtCodeInput(e.target.value);e.target.value=f;S.codeIn=f}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modal').classList.contains('open'))ACT.mCancel()});
// Sekme gizlenince: karar süresi ölçümü için işaretlenir, durum kaydedilir
document.addEventListener('visibilitychange',function(){if(document.hidden)S.lastHiddenAt=Date.now();if(!S.code)return;log(document.hidden?'hidden':'visible',{});if(document.hidden){saveSnap();flush()}});
addEventListener('pagehide',function(){if(S.code){saveSnap();flush()}});
setInterval(function(){if(S.code&&EVQ.length)flush()},15000);
// Pano otomatik yenileme: yalnızca panel açıkken ve bir kutuya yazılmıyorsa (yazılan alanlar silinmesin)
function dashAutoTick(){if(!S.dashAuto||S.stage!=='admin'||S.dashBusy||!S.dash)return false;var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=='checkbox')return false;loadDash();return true}
setInterval(dashAutoTick,30000);  // Bağlantı kopmuşsa kuyruğu düzenli dene

// ═════════════════ MODAL ═════════════════
// Odak yönetimi: pencere açılınca odak pencerenin kutusuna (klavye ve ekran okuyucu için), kapanınca eski yerine döner.
// Kutuya odaklanılır, ilk düğmeye değil: alan içeren pencerelerde mobil klavye kendiliğinden açılmasın.
function openModal(h){var m=$('modal'),bx=$('mbox');if(!m.classList.contains('open')){var a=document.activeElement;S._focusBack=a&&a!==document.body?a:null}
bx.innerHTML=h;m.classList.add('open');var t=bx.querySelector('h2');if(t){t.id='mtitle';m.setAttribute('aria-labelledby','mtitle')}
bx.setAttribute('tabindex','-1');try{bx.focus({preventScroll:true})}catch(e){}}
function closeModal(){$('modal').classList.remove('open');$('mbox').innerHTML='';var f=S._focusBack;S._focusBack=null;
if(f&&document.contains(f)&&f.focus){try{f.focus({preventScroll:true})}catch(e){}}}
// Tarayıcının confirm() kutusu çerçeve içinde engellenebildiği için kendi onay penceremiz
function askConfirm(title,text,okLabel,danger,fn){S._ok=fn;openModal('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><button class="btn '+(danger?'danger':'pri')+'" data-a="mOk">'+esc(okLabel)+'</button><button class="btn" data-a="mCancel">Vazgeç</button>')}
async function doWithdraw(){var c=S.code,g=S.grp;remember(null);S.allocCache=null;try{await Store.withdraw(c,g)}catch(e){note('Çekilme kaydedilemedi, bağlantını kontrol edip tekrar dene.');return}
try{localStorage.removeItem('ilklot:q:'+c);localStorage.removeItem('ilklot:evn:'+c)}catch(e){}clearInterval(S.cdt);EVQ=[];S.code=null;S.ended=true;S.tr=null;S.stage='withdrawn';render()}

// Yazı boyutu (b22 geri geldi): kayıtlı tercih 'ilklot:fs' (0/1/2); geçersiz değer yok sayılır. Bir arayüz ayarıdır, katılımcı verisi değil.
(function(){var f=null;try{f=localStorage.getItem('ilklot:fs')}catch(e){}
if(f==='1'||f==='2')document.documentElement.setAttribute('data-fs',f)})();
// Tema: kayıtlı tercih > görüntüleyicinin verdiği data-theme > cihazın teması. Tercih bir arayüz ayarıdır (katılımcı verisi değil).
(function(){var t=null;try{t=localStorage.getItem('ilklot:theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=null;if(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark'}
if(t)document.documentElement.setAttribute('data-theme',t)})();
var storeReady=Store.init();
render();boot();
</script>
</body>
</html>
